耗:
  meaning: Wear Out
  primary_reading: もう
  reading_type: onyomi
  meaning_mnemonic: >-
    A farmer drags a <radical>plow</radical> through the field using a rope made of <radical>fur</radical>. Every row rubs a little more fur off until the whole rope is thin and bald. Things that get used like this <kanji>wear out</kanji>.
  reading_mnemonic: >-
    When the rope finally <kanji>wears out</kanji>, the farmer just sighs and says he needs <reading>mo</reading>re (もう) fur. The <radical>fur</radical> part gives you the sound, since 毛 is also もう.
虞:
  meaning: Fear
  primary_reading: おそれ
  reading_type: kunyomi
  meaning_mnemonic: >-
    A <radical>tiger</radical> is sitting on top of a loaded <radical>catapult</radical>, ready to be launched right at you. Nothing good can come of this. You are filled with <kanji>fear</kanji> of what might happen next.
  reading_mnemonic: >-
    Your <kanji>fear</kanji> grows as the tiger lands next to you and asks, "<reading>Oh, so it's</reading> <reading>re</reading>ally you?" (おそれ). It sounds friendly, which is somehow even worse.
謁:
  meaning: Audience
  primary_reading: えつ
  reading_type: onyomi
  meaning_mnemonic: >-
    You finally get to <radical>say</radical> something to the king, but all you can think of is <radical>why</radical> you are even here. That is what it is like to have an <kanji>audience</kanji> with royalty.
  reading_mnemonic: >-
    During your <kanji>audience</kanji>, you are so nervous you just go "<reading>eh... tsu</reading>" (えつ) and stare at your shoes.
賦:
  meaning: Levy
  primary_reading: ふ
  reading_type: onyomi
  meaning_mnemonic: >-
    The <radical>military</radical> marches into town and starts collecting <radical>shellfish</radical>, which people used as money. Everyone has to pay up. This is a <kanji>levy</kanji>.
  reading_mnemonic: >-
    When the soldiers come to collect the <kanji>levy</kanji>, you puff out your cheeks and go "<reading>fu</reading>" (ふ) as you hand over your last shells.
遵:
  meaning: Obey
  primary_reading: じゅん
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>revered</radical> elder rides by on a <radical>scooter</radical> and tells everyone to follow the rules of the road. Because he is so revered, everyone does exactly as he says. They <kanji>obey</kanji>.
  reading_mnemonic: >-
    The elder only rides around in <reading>June</reading> (じゅん), and every June everyone <kanji>obeys</kanji> the traffic rules perfectly.
采:
  meaning: Gather
  primary_reading: さい
  reading_type: onyomi
  meaning_mnemonic: >-
    You strap on a pair of <radical>cleats</radical> and climb up a <radical>tree</radical> to pick its fruit. You grab everything you can reach. You <kanji>gather</kanji> it all.
  reading_mnemonic: >-
    Once you <kanji>gather</kanji> all the fruit, you press it into a big jug of <reading>ci</reading>der (さい).
丞:
  meaning: Help
  primary_reading: じょう
  reading_type: onyomi
  meaning_mnemonic: >-
    You <radical>finish</radical> pulling someone out of the <radical>water</radical> and lay them safely on the <radical>ground</radical>. You were there to <kanji>help</kanji>.
  reading_mnemonic: >-
    The person you <kanji>help</kanji>ed turns out to be your old friend <reading>Joe</reading> (じょう), who promises to buy you dinner.
亥:
  meaning: Boar (Zodiac)
  primary_reading: い
  reading_type: kunyomi
  meaning_mnemonic: >-
    A <radical>person</radical> wears a pot <radical>lid</radical> as a helmet because something is charging at them. It is a wild boar, the last sign of the zodiac. This is the <kanji>boar</kanji>.
  reading_mnemonic: >-
    The <kanji>boar</kanji> crashes into the lid with a loud "<reading>eee</reading>!" (い), and the person runs away.
亦:
  meaning: Also
  primary_reading: また
  reading_type: kunyomi
  meaning_mnemonic: >-
    Under a <radical>lid</radical> there is a <radical>slide</radical> and a <radical>barb</radical>. You thought you only had a slide, but you <kanji>also</kanji> have a barb. Ouch.
  reading_mnemonic: >-
    You <kanji>also</kanji> find a sign that says "<reading>mata</reading>" (また), which you already know means "again." Also, again, the same thing.
伶:
  meaning: Actor
  primary_reading: れい
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>person</radical> stands on stage and follows the director's <radical>orders</radical> line by line. That person is an <kanji>actor</kanji>.
  reading_mnemonic: >-
    The <kanji>actor</kanji> is hit by a bright <reading>ray</reading> (れい) of stage light. The <radical>orders</radical> part gives the sound, just like 令 (れい).
侃:
  meaning: Righteous
  primary_reading: かん
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>person</radical> opens their <radical>mouth</radical> and the words pour out like a <radical>river</radical>, straight and strong. They never lie and never back down. They are <kanji>righteous</kanji>.
  reading_mnemonic: >-
    This <kanji>righteous</kanji> person always says "Yes, I <reading>can</reading>" (かん) to doing the right thing.
侑:
  meaning: Urge to Eat
  primary_reading: ゆう
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>person</radical> who <radical>has</radical> a huge plate of food keeps pushing it toward their guest. "Eat! Eat more!" They <kanji>urge to eat</kanji>.
  reading_mnemonic: >-
    The host points at the guest and says "<reading>You</reading> (ゆう) must eat!" as they <kanji>urge to eat</kanji>. The <radical>have</radical> part gives the sound, like 有 (ゆう).
倖:
  meaning: Luck
  primary_reading: こう
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>person</radical> is bursting with <radical>happiness</radical> because everything is going their way today. That is just pure <kanji>luck</kanji>.
  reading_mnemonic: >-
    With all that <kanji>luck</kanji>, they find a hundred dollars in their <reading>coa</reading>t (こう) pocket. The <radical>happiness</radical> part gives the sound, like 幸 (こう).
凜:
  meaning: Dignified
  primary_reading: りん
  reading_type: onyomi
  meaning_mnemonic: >-
    A noble stands perfectly still on the <radical>ice</radical>, receiving their <radical>salary in rice</radical> without a word or a smile. Cold, severe, and proud, they are truly <kanji>dignified</kanji>.
  reading_mnemonic: >-
    The <kanji>dignified</kanji> noble wears a single gold <reading>ring</reading> (りん) that glitters against the ice.
凪:
  meaning: Calm Sea
  primary_reading: なぎ
  reading_type: kunyomi
  meaning_mnemonic: >-
    You put a <radical>table</radical> out on the beach and tell the wind to <radical>stop</radical>. It actually listens. The waves go flat and you have a <kanji>calm sea</kanji>.
  reading_mnemonic: >-
    Without the wind, there is nothing to <reading>nag</reading> (なぎ) you, so you sit at your table and enjoy the <kanji>calm sea</kanji>.
勁:
  meaning: Strong
  primary_reading: けい
  reading_type: onyomi
  meaning_mnemonic: >-
    <radical>Streams running underground</radical> carve through solid rock with incredible <radical>power</radical>. Nothing can stop them. They are <kanji>strong</kanji>.
  reading_mnemonic: >-
    The <kanji>strong</kanji> streams burst out into a <reading>cave</reading> (けい) and flood it in seconds.
勺:
  meaning: Ladle
  primary_reading: しゃく
  reading_type: onyomi
  meaning_mnemonic: >-
    In <radical>prison</radical>, the only thing the cook has is a scoop that holds a single <radical>drop</radical> of soup. That tiny scoop is the <kanji>ladle</kanji>.
  reading_mnemonic: >-
    The prisoners are <reading>shock</reading>ed (しゃく) when they see how small the <kanji>ladle</kanji> is.
匁:
  meaning: Monme
  primary_reading: もんめ
  reading_type: kunyomi
  meaning_mnemonic: >-
    In <radical>prison</radical>, the guards <radical>mow</radical> off just a tiny pinch of your rice to weigh it. That pinch is one <kanji>monme</kanji>, an old unit of about 3.75 grams.
  reading_mnemonic: >-
    The word for this weight is the same as its meaning, so just remember that a <kanji>monme</kanji> is a <reading>monme</reading> (もんめ), as in "<reading>mon</reading>ey <reading>me</reading>asured" by weight.
叡:
  meaning: Intelligence
  primary_reading: えい
  reading_type: onyomi
  meaning_mnemonic: >-
    A wise sage sits on a <radical>stool</radical> and shares their <radical>intelligence</radical> with anyone who walks by. This is deep, imperial-level <kanji>intelligence</kanji>.
  reading_mnemonic: >-
    The sage's <kanji>intelligence</kanji> earns an <reading>A</reading> (えい) on every test. The <radical>intelligence</radical> part 睿 gives the sound.
奎:
  meaning: Star
  primary_reading: けい
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>big</radical> <radical>square jewel</radical> hangs in the night sky, glowing brighter than anything else. It is the <kanji>star</kanji> of literature.
  reading_mnemonic: >-
    The <kanji>star</kanji> shines down into a dark <reading>cave</reading> (けい), where a poet is writing by its light.
宥:
  meaning: Soothe
  primary_reading: なだ
  reading_type: kunyomi
  meaning_mnemonic: >-
    Under your <radical>roof</radical> you <radical>have</radical> a crying baby. You rock it, hum, and pat its back until it calms down. You <kanji>soothe</kanji> it.
  reading_mnemonic: >-
    You <kanji>soothe</kanji> the baby until it is <reading>nada</reading> (なだ), nothing, not a single sound.
崚:
  meaning: Towering Peaks
  primary_reading: りょう
  reading_type: onyomi
  meaning_mnemonic: >-
    A row of <radical>mountains</radical> stands so tall and cold that climbers get <radical>frostbite</radical> just looking at them. These are <kanji>towering peaks</kanji>.
  reading_mnemonic: >-
    At the foot of the <kanji>towering peaks</kanji> a climber yells "<reading>Rio</reading>!" (りょう), wishing they had gone to the beach instead.
嵩:
  meaning: Bulk
  primary_reading: かさ
  reading_type: kunyomi
  meaning_mnemonic: >-
    A <radical>mountain</radical> that is also extremely <radical>tall</radical> takes up a huge amount of space. That is a lot of <kanji>bulk</kanji>.
  reading_mnemonic: >-
    All that <kanji>bulk</kanji> rolls down the slope like a giant <reading>cassa</reading>va (かさ) root, squashing everything.
恕:
  meaning: Forgive
  primary_reading: じょ
  reading_type: onyomi
  meaning_mnemonic: >-
    When your <radical>heart</radical> sees someone in a <radical>likeness</radical> of yourself, it is hard to stay angry at them. So you <kanji>forgive</kanji> them.
  reading_mnemonic: >-
    You <kanji>forgive</kanji> your friend <reading>Jo</reading> (じょ) for eating your lunch. The <radical>likeness</radical> part gives the sound, like 如 (じょ).
捷:
  meaning: Swift Victory
  primary_reading: しょう
  reading_type: onyomi
  meaning_mnemonic: >-
    Your <radical>fingers</radical> grab a <radical>broom</radical> and sweep the enemy off the field in seconds. That is a <kanji>swift victory</kanji>.
  reading_mnemonic: >-
    The crowd cheers for your <kanji>swift victory</kanji> and asks you to put on a <reading>show</reading> (しょう) of it again.
捺:
  meaning: Press
  primary_reading: なつ
  reading_type: onyomi
  meaning_mnemonic: >-
    In <radical>Nara</radical>, you use your <radical>fingers</radical> to push your seal firmly onto the paper. You <kanji>press</kanji> down hard.
  reading_mnemonic: >-
    You <kanji>press</kanji> so hard that the stamp cracks a bowl of <reading>nuts</reading> (なつ) sitting underneath.
昂:
  meaning: Rise
  primary_reading: こう
  reading_type: onyomi
  meaning_mnemonic: >-
    The <radical>sun</radical> comes up over a giant <radical>stamp</radical> that the kingdom uses to mark the start of each day. Every morning the sun and your spirits <kanji>rise</kanji>.
  reading_mnemonic: >-
    As the sun starts to <kanji>rise</kanji>, you throw on your <reading>coa</reading>t (こう) and head out.
昴:
  meaning: Pleiades
  primary_reading: すばる
  reading_type: kunyomi
  meaning_mnemonic: >-
    Long after the <radical>sun</radical> sets, a cluster of stars shaped like a little <radical>rabbit</radical> appears. These are the <kanji>Pleiades</kanji>.
  reading_mnemonic: >-
    You watch the <kanji>Pleiades</kanji> from a <reading>sub</reading>way <reading>bar</reading> rooftop (すばる), naming each little star.
晏:
  meaning: Late
  primary_reading: あん
  reading_type: onyomi
  meaning_mnemonic: >-
    The <radical>sun</radical> is going down and everything is <radical>cheap</radical> at the market now. It is quiet, and it is getting <kanji>late</kanji>.
  reading_mnemonic: >-
    It is so <kanji>late</kanji> that only an <reading>an</reading>t (あん) is still shopping. The <radical>cheap</radical> part gives the sound, like 安 (あん).
晟:
  meaning: Clear
  primary_reading: せい
  reading_type: onyomi
  meaning_mnemonic: >-
    The clouds move away and the <radical>sun</radical> shines so hard the whole sky <radical>becomes</radical> bright. It is completely <kanji>clear</kanji>.
  reading_mnemonic: >-
    On such a <kanji>clear</kanji> day, you <reading>say</reading> (せい) hello to everyone you meet. The <radical>become</radical> part gives the sound, like 成 (せい).
晨:
  meaning: Morning
  primary_reading: しん
  reading_type: onyomi
  meaning_mnemonic: >-
    The <radical>sun</radical> rises and lights up the rubble of last night's <radical>landslide</radical>. It is early <kanji>morning</kanji>.
  reading_mnemonic: >-
    In the <kanji>morning</kanji> light you notice you scraped your <reading>shin</reading> (しん) climbing over the rocks. The <radical>landslide</radical> part gives the sound, like 辰 (しん).
柊:
  meaning: Holly
  primary_reading: ひいらぎ
  reading_type: kunyomi
  meaning_mnemonic: >-
    One <radical>tree</radical> stays green and spiky all through <radical>winter</radical>, with bright red berries. That tree is <kanji>holly</kanji>.
  reading_mnemonic: >-
    You brush against the <kanji>holly</kanji> and yell "<reading>Hee</reading>! It's a <reading>rag</reading>... <reading>ee</reading>!" (ひいらぎ) as its spiky leaves tear your sleeve into rags.
柾:
  meaning: Straight Grain
  primary_reading: まさ
  reading_type: kunyomi
  meaning_mnemonic: >-
    You cut a <radical>tree</radical> and see the lines inside run perfectly parallel, exactly how they are supposed to be. It is the <radical>correct</radical> kind of wood, with a <kanji>straight grain</kanji>.
  reading_mnemonic: >-
    Wood with a <kanji>straight grain</kanji> is perfect for a <reading>massa</reading>ge (まさ) table.
梢:
  meaning: Treetop
  primary_reading: こずえ
  reading_type: kunyomi
  meaning_mnemonic: >-
    The highest twigs of a <radical>tree</radical> bear a small <radical>resemblance</radical> to the whole tree below them. Up there is the <kanji>treetop</kanji>.
  reading_mnemonic: >-
    A cat is stuck in the <kanji>treetop</kanji>, and it's there "<reading>'cause</reading> <reading>the</reading> <reading>A</reading>" (こずえ) student dared it.
梧:
  meaning: Parasol Tree
  primary_reading: ご
  reading_type: onyomi
  meaning_mnemonic: >-
    "<radical>I</radical> am the best <radical>tree</radical>," says one tree, opening its big leaves wide like an umbrella. It is the <kanji>parasol tree</kanji>, where phoenixes are said to rest.
  reading_mnemonic: >-
    A phoenix lands on the <kanji>parasol tree</kanji> and yells "<reading>Go</reading>!" (ご). The <radical>I</radical> part gives the sound, like 吾 (ご).
椋:
  meaning: Starling
  primary_reading: むく
  reading_type: kunyomi
  meaning_mnemonic: >-
    A flock of birds flies from a <radical>tree</radical> to the <radical>capital</radical> and back every day, making a huge noise. These grey birds are <kanji>starling</kanji>s.
  reading_mnemonic: >-
    The <kanji>starling</kanji>s leave <reading>muck</reading> (むく) all over the capital's streets.
椰:
  meaning: Coconut Palm
  primary_reading: や
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>tree</radical> with a <radical>question mark</radical> shape curves out over the beach, holding big hairy nuts. It is a <kanji>coconut palm</kanji>.
  reading_mnemonic: >-
    A coconut falls from the <kanji>coconut palm</kanji> and you shout "<reading>Yah</reading>!" (や) as you dodge it. The <radical>question mark</radical> part gives the sound, like 耶 (や).
汀:
  meaning: Shore
  primary_reading: なぎさ
  reading_type: kunyomi
  meaning_mnemonic: >-
    A <radical>tsunami</radical> washes right up to the end of the <radical>street</radical> and stops. That is where the water meets the land: the <kanji>shore</kanji>.
  reading_mnemonic: >-
    On the <kanji>shore</kanji> a seagull keeps <reading>nag</reading>ging you, saying "<reading>Nagi</reading>, <reading>sa</reading>!" (なぎさ) until you share your snack.
洵:
  meaning: Truly
  primary_reading: じゅん
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>tsunami</radical> only comes <radical>in season</radical> once every hundred years. When it hits, you realize the old legends were <kanji>truly</kanji> right.
  reading_mnemonic: >-
    It <kanji>truly</kanji> did come, and it came in <reading>June</reading> (じゅん). The <radical>in season</radical> part gives the sound, like 旬 (じゅん).
滉:
  meaning: Vast Water
  primary_reading: こう
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>tsunami</radical> spreads out under a <radical>clear</radical> sky as far as you can see. It is deep, broad, <kanji>vast water</kanji>.
  reading_mnemonic: >-
    Floating on the <kanji>vast water</kanji>, you zip up your <reading>coa</reading>t (こう) to stay warm. The <radical>clear</radical> part 晃 gives the sound (こう).
澪:
  meaning: Water Channel
  primary_reading: みお
  reading_type: kunyomi
  meaning_mnemonic: >-
    A <radical>tsunami</radical> rushes in, but there is <radical>zero</radical> damage because it flows down one safe, deep path for boats. That path is a <kanji>water channel</kanji>.
  reading_mnemonic: >-
    A cat sits on a boat in the <kanji>water channel</kanji>, going "<reading>meow</reading>" (みお) at every ship that passes.
熙:
  meaning: Bright
  primary_reading: き
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>snake</radical> sits in a <radical>cage</radical> placed right over a <radical>boil</radical>ing fire. The flames light up the whole room. It is cheerful and <kanji>bright</kanji>.
  reading_mnemonic: >-
    In that <kanji>bright</kanji> light, you finally find your lost <reading>key</reading> (き).
燎:
  meaning: Bonfire
  primary_reading: りょう
  reading_type: onyomi
  meaning_mnemonic: >-
    You toss a pile of <radical>charcoal</radical> onto the <radical>fire</radical> and it roars up into the night sky. Now it is a <kanji>bonfire</kanji>.
  reading_mnemonic: >-
    Everyone dances around the <kanji>bonfire</kanji> like it is carnival in <reading>Rio</reading> (りょう). The <radical>charcoal</radical> part gives the sound, like 尞 (りょう).
燦:
  meaning: Brilliant
  primary_reading: さん
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>fire</radical> burns so hot it turns everything <radical>bright</radical> as day. The light is dazzling and <kanji>brilliant</kanji>.
  reading_mnemonic: >-
    The fire is as <kanji>brilliant</kanji> as the <reading>sun</reading> (さん) itself. The <radical>bright</radical> part 粲 gives the sound (さん).
