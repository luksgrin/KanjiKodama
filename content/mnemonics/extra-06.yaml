燿:
  meaning: Shine
  primary_reading: よう
  reading_type: onyomi
  meaning_mnemonic: >-
    A family with a fancy <radical>surname</radical> lights a huge <radical>fire</radical> in front of their mansion so everyone can read their name. The flames make the letters <kanji>shine</kanji> for miles.
  reading_mnemonic: >-
    The name keeps <kanji>shining</kanji> all night, and the neighbours yell "<reading>yo</reading>!" (よう) at it until morning.
爾:
  meaning: You
  primary_reading: じ
  reading_type: onyomi
  meaning_mnemonic: >-
    On the <radical>ground</radical> stands a <radical>head</radical> with <radical>eight</radical> arms, stirring a pot <radical>to mix with</radical> everything. It points one arm straight at you and says, very old-fashioned, "Thou! Yes, <kanji>you</kanji>!"
  reading_mnemonic: >-
    It keeps pointing at <kanji>you</kanji> and shouting "<reading>Gee</reading> (じ), it's you!" like it has been waiting a thousand years.
玖:
  meaning: Black Jewel
  primary_reading: きゅう
  reading_type: onyomi
  meaning_mnemonic: >-
    The <radical>king</radical> has stared at the same dark stone for a <radical>long time</radical>. It is so deep and dark it seems to swallow light: his favourite <kanji>black jewel</kanji>.
  reading_mnemonic: >-
    Everyone wants to see the <kanji>black jewel</kanji>, so they wait in a long <reading>queue</reading> (きゅう) outside the palace. The <radical>long time</radical> part gives the sound, just like 久 (きゅう).
琳:
  meaning: Jewel
  primary_reading: りん
  reading_type: onyomi
  meaning_mnemonic: >-
    The <radical>king</radical> hangs tiny gems on every tree in his <radical>forest</radical>. When the wind blows, the whole forest tinkles with <kanji>jewels</kanji>.
  reading_mnemonic: >-
    Each <kanji>jewel</kanji> goes "<reading>rin</reading>g, <reading>rin</reading>g" (りん) like a little bell. The <radical>forest</radical> part gives the sound, just like 林 (りん).
瑚:
  meaning: Coral
  primary_reading: ご
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>barbarian</radical> dives into the sea and brings the <radical>king</radical> a gift that looks like a red, branching jewel. It is <kanji>coral</kanji>, the treasure of the sea.
  reading_mnemonic: >-
    The king loves the <kanji>coral</kanji> so much he shouts "<reading>Go</reading>! (ご) Get me more!" and the barbarian dives again.
瑳:
  meaning: Polish
  primary_reading: さ
  reading_type: onyomi
  meaning_mnemonic: >-
    The <radical>king</radical> wants his jewels to stand out, so he keeps rubbing them until you can see the <radical>distinction</radical> from everyone else's. All day long he does nothing but <kanji>polish</kanji>.
  reading_mnemonic: >-
    He <kanji>polishes</kanji> so hard his arm gets <reading>sa</reading>re (さ). The <radical>distinction</radical> part gives the sound, just like 差 (さ).
瑶:
  meaning: Beautiful Jewel
  primary_reading: よう
  reading_type: onyomi
  meaning_mnemonic: >-
    The <radical>king</radical> grabs a dented <radical>can</radical> with his <radical>cleat</radical>, cracks it open, and finds something glowing inside. It is a <kanji>beautiful jewel</kanji> hidden in the trash.
  reading_mnemonic: >-
    Holding up the <kanji>beautiful jewel</kanji>, the king shouts "<reading>Yo</reading>! (よう) Look what I found in a can!"
眸:
  meaning: Pupil
  primary_reading: ひとみ
  reading_type: kunyomi
  meaning_mnemonic: >-
    Look deep into an <radical>eye</radical> and you will find a little black dot in the middle, the <radical>pupil (eye)</radical>. This kanji is all about that dark center, the <kanji>pupil</kanji>.
  reading_mnemonic: >-
    A bright light hits your <kanji>pupil</kanji> and you shout "<reading>He hit me</reading>! (ひとみ)" while it shrinks to a tiny dot.
碩:
  meaning: Great
  primary_reading: せき
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>geoduck</radical> lifts a giant <radical>stone</radical> over its head like a strongman. Everyone agrees that is one <kanji>great</kanji> geoduck.
  reading_mnemonic: >-
    The <kanji>great</kanji> geoduck gets so famous it gets a <reading>sec</reading>retary (せき) to handle the fans. The <radical>stone</radical> part gives the sound, just like 石 (せき).
竣:
  meaning: Completion
  primary_reading: しゅん
  reading_type: onyomi
  meaning_mnemonic: >-
    The builders finally get their <radical>license</radical>, work through the cold <radical>winter</radical>, and at last <radical>stand</radical> up proudly next to the finished building. The project has reached <kanji>completion</kanji>.
  reading_mnemonic: >-
    At the <kanji>completion</kanji> party everyone wants to go home, but nobody can <reading>shun</reading> (しゅん) the boss's speech. You'll see it in 竣工, completion of construction.
笙:
  meaning: Reed Pipe
  primary_reading: しょう
  reading_type: onyomi
  meaning_mnemonic: >-
    You cut some <radical>bamboo</radical> and blow into it, and suddenly it comes to <radical>life</radical> with music. You have made a <kanji>reed pipe</kanji>.
  reading_mnemonic: >-
    You play your <kanji>reed pipe</kanji> in a big <reading>show</reading> (しょう) and the audience loves it.
紗:
  meaning: Gauze
  primary_reading: さ
  reading_type: onyomi
  meaning_mnemonic: >-
    Use only a <radical>few</radical> strands of <radical>thread</radical> and you get cloth so thin you can see right through it. That is <kanji>gauze</kanji>.
  reading_mnemonic: >-
    The <kanji>gauze</kanji> is so thin that the wind blows it away and you cry "<reading>Sa</reading>d (さ)!"
紬:
  meaning: Pongee
  primary_reading: つむぎ
  reading_type: kunyomi
  meaning_mnemonic: >-
    Granny spins knotted silk <radical>thread</radical> for a <radical>reason</radical>: she is weaving a rough, sturdy silk cloth called <kanji>pongee</kanji>.
  reading_mnemonic: >-
    The <kanji>pongee</kanji> is so tough that it survives being dropped in a <reading>tsu</reading>nami with a <reading>moo</reading>ing cow and a <reading>gee</reading>se (つむぎ). Tsu-mu-gi.
絃:
  meaning: String
  primary_reading: げん
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>mysterious</radical> <radical>thread</radical> is stretched tight across a shamisen. When you pluck it, it hums: it is a <kanji>string</kanji> for an instrument.
  reading_mnemonic: >-
    The <kanji>string</kanji> plays a song so beautiful that it makes even a cranky old <reading>gen</reading>eral (げん) cry. The <radical>mysterious</radical> part gives the sound, just like 玄 (げん).
綸:
  meaning: Silk Thread
  primary_reading: りん
  reading_type: onyomi
  meaning_mnemonic: >-
    You <radical>think</radical> very carefully about which <radical>thread</radical> to use for the emperor's robe. Only the finest <kanji>silk thread</kanji> will do.
  reading_mnemonic: >-
    You wind the <kanji>silk thread</kanji> into a shiny <reading>rin</reading>g (りん). The <radical>think</radical> part gives the sound, just like in 輪 (りん).
耶:
  meaning: Question Mark
  primary_reading: や
  reading_type: onyomi
  meaning_mnemonic: >-
    A whole <radical>village</radical> cups its <radical>ear</radical> toward you because nobody understood what you said. Above every head floats a big <kanji>question mark</kanji>.
  reading_mnemonic: >-
    The <kanji>question mark</kanji> village all shout "<reading>Ya</reading> (や) what?" at the same time.
胤:
  meaning: Offspring
  primary_reading: いん
  reading_type: onyomi
  meaning_mnemonic: >-
    Under the <radical>moon</radical>, a little <radical>poop</radical> grows tiny <radical>legs</radical> and runs off. It is the proud <kanji>offspring</kanji> of a long, smelly family line.
  reading_mnemonic: >-
    The <kanji>offspring</kanji> runs straight <reading>in</reading> (いん) the house to meet its ancestors.
脹:
  meaning: Swell
  primary_reading: ちょう
  reading_type: onyomi
  meaning_mnemonic: >-
    Your body part (<radical>moon</radical>) gets stung by a bee and it starts to grow <radical>long</radical> and puffy. It just keeps going: it's starting to <kanji>swell</kanji>.
  reading_mnemonic: >-
    It <kanji>swells</kanji> because you ate a huge <reading>cho</reading>colate bar (ちょう) right before. The <radical>long</radical> part gives the sound, just like 長 (ちょう).
茄:
  meaning: Eggplant
  primary_reading: か
  reading_type: onyomi
  meaning_mnemonic: >-
    You <radical>add</radical> some <radical>flowers</radical> to your garden, and they turn into fat purple vegetables. They're <kanji>eggplants</kanji>.
  reading_mnemonic: >-
    The <kanji>eggplant</kanji> is so big you load it into your <reading>ca</reading>r (か). The <radical>add</radical> part gives the sound, just like 加 (か). In the word 茄子 it is read なす.
茉:
  meaning: Jasmine
  primary_reading: まつ
  reading_type: onyomi
  meaning_mnemonic: >-
    At the very <radical>end</radical> of the garden grow small white <radical>flowers</radical> that smell sweeter than anything else. They're <kanji>jasmine</kanji>.
  reading_mnemonic: >-
    The <kanji>jasmine</kanji> smells so good you lie down on a <reading>mat</reading> (まつ) to enjoy it. The <radical>end</radical> part gives the sound, just like 末 (まつ).
莞:
  meaning: Smile
  primary_reading: かん
  reading_type: onyomi
  meaning_mnemonic: >-
    Someone hands you a <radical>perfect</radical> bouquet of <radical>flowers</radical>. You can't help it, you break into a big <kanji>smile</kanji>.
  reading_mnemonic: >-
    You <kanji>smile</kanji> so much that people say "she <reading>can</reading> (かん) not stop!" The <radical>perfect</radical> part gives the sound, just like 完 (かん).
菖:
  meaning: Iris
  primary_reading: しょう
  reading_type: onyomi
  meaning_mnemonic: >-
    Among the <radical>flowers</radical> in a <radical>prosperous</radical> garden, the proudest are the tall purple ones by the pond. They're <kanji>irises</kanji>.
  reading_mnemonic: >-
    The <kanji>irises</kanji> are so pretty the garden puts on a flower <reading>show</reading> (しょう). The <radical>prosperous</radical> part gives the sound, just like 昌 (しょう).
菫:
  meaning: Violet
  primary_reading: すみれ
  reading_type: kunyomi
  meaning_mnemonic: >-
    Under the <radical>flowers</radical> radical, <radical>three</radical> layers of soil hide a tiny shy purple flower. It is a <kanji>violet</kanji>.
  reading_mnemonic: >-
    A <reading>sumo</reading> wrestler named <reading>Mere</reading> (すみれ) carefully picks the little <kanji>violet</kanji> with his giant fingers. Su-mi-re.
蓉:
  meaning: Lotus
  primary_reading: よう
  reading_type: onyomi
  meaning_mnemonic: >-
    Some <radical>flowers</radical> have such a perfect round <radical>form</radical> that they float on the pond like plates. They're <kanji>lotuses</kanji>.
  reading_mnemonic: >-
    A frog sitting on a <kanji>lotus</kanji> waves at you and says "<reading>Yo</reading> (よう)!" The <radical>form</radical> part gives the sound, just like 容 (よう).
蕗:
  meaning: Butterbur
  primary_reading: ふき
  reading_type: kunyomi
  meaning_mnemonic: >-
    Along the <radical>road</radical> grow <radical>flowers</radical> with giant round leaves, big enough to use as umbrellas. Those plants are <kanji>butterbur</kanji>.
  reading_mnemonic: >-
    You hide under the <kanji>butterbur</kanji> leaves and play <reading>hooky</reading> (ふき) from school all day.
衿:
  meaning: Collar
  primary_reading: えり
  reading_type: kunyomi
  meaning_mnemonic: >-
    <radical>Now</radical> that your <radical>outfit</radical> is on, there's just one thing left to fix: the part around your neck. You straighten your <kanji>collar</kanji>.
  reading_mnemonic: >-
    Your friend <reading>Eri</reading>c (えり) always flips his <kanji>collar</kanji> up to look cool.
袈:
  meaning: Monk Robe
  primary_reading: け
  reading_type: onyomi
  meaning_mnemonic: >-
    A monk <radical>adds</radical> a big rectangle of cloth over his <radical>clothes</radical> and drapes it over one shoulder. That's his <kanji>monk robe</kanji>.
  reading_mnemonic: >-
    He wears his <kanji>monk robe</kanji> to a party and spills <reading>ke</reading>tchup (け) on it. You'll see it in 袈裟 (けさ), the Buddhist robe.
裟:
  meaning: Surplice
  primary_reading: さ
  reading_type: onyomi
  meaning_mnemonic: >-
    A monk drags his <radical>clothes</radical> through the <radical>sand</radical> while he walks to the temple. Over them he wears his flowing Buddhist <kanji>surplice</kanji>.
  reading_mnemonic: >-
    His <kanji>surplice</kanji> is full of sand, which makes him <reading>sa</reading>d (さ). The <radical>sand</radical> part gives the sound, just like 沙 (さ).
詢:
  meaning: Consult
  primary_reading: じゅん
  reading_type: onyomi
  meaning_mnemonic: >-
    Before planting, a farmer goes to the old wise woman to <radical>say</radical> his worries and ask which vegetables are <radical>in season</radical>. He has come to <kanji>consult</kanji> her.
  reading_mnemonic: >-
    He <kanji>consults</kanji> her every <reading>June</reading> (じゅん). The <radical>in season</radical> part gives the sound, just like 旬 (じゅん).
誼:
  meaning: Friendship
  primary_reading: ぎ
  reading_type: onyomi
  meaning_mnemonic: >-
    Every time you meet, you <radical>say</radical> "<radical>best regards</radical>" to each other and mean it. That's a real <kanji>friendship</kanji>.
  reading_mnemonic: >-
    Your <kanji>friendship</kanji> is so strong you share your <reading>gee</reading>se (ぎ) with each other. The <radical>best regards</radical> part gives the sound, just like 宜 (ぎ).
諄:
  meaning: Tedious
  primary_reading: くど
  reading_type: kunyomi
  meaning_mnemonic: >-
    Someone <radical>says</radical> the same thing over and over, and you are forced to <radical>receive</radical> every single word. It is so <kanji>tedious</kanji>.
  reading_mnemonic: >-
    The <kanji>tedious</kanji> speaker goes on and on about his <reading>kudo</reading>s (くど) until you fall asleep. It's used in くどい, long-winded.
迪:
  meaning: Guide
  primary_reading: てき
  reading_type: onyomi
  meaning_mnemonic: >-
    You hop on a <radical>scooter</radical> and drive ahead of the group, showing them the path for a good <radical>reason</radical>. You are their <kanji>guide</kanji>.
  reading_mnemonic: >-
    As their <kanji>guide</kanji>, you lead them to a <reading>tech</reading> (てき) shop downtown.
醇:
  meaning: Mellow
  primary_reading: じゅん
  reading_type: onyomi
  meaning_mnemonic: >-
    You <radical>receive</radical> a bottle of <radical>alcohol</radical> that has aged for years. It is pure, smooth and rich: perfectly <kanji>mellow</kanji> sake.
  reading_mnemonic: >-
    The <kanji>mellow</kanji> sake was brewed last <reading>June</reading> (じゅん), the best month for sake.
銑:
  meaning: Pig Iron
  primary_reading: せん
  reading_type: onyomi
  meaning_mnemonic: >-
    The <radical>previous</radical> step before you get shiny steel or <radical>gold</radical>-like metal is a lump of rough, unrefined iron. That's <kanji>pig iron</kanji>.
  reading_mnemonic: >-
    The <kanji>pig iron</kanji> is so cheap it only costs one <reading>cen</reading>t (せん). The <radical>previous</radical> part gives the sound, just like 先 (せん).
錘:
  meaning: Weight
  primary_reading: おもり
  reading_type: kunyomi
  meaning_mnemonic: >-
    A lump of <radical>gold</radical> hangs <radical>droopy</radical> from the end of a fishing line, pulling it straight down. It's a <kanji>weight</kanji>.
  reading_mnemonic: >-
    You tie the <kanji>weight</kanji> on and say "<reading>Oh, more</reading>, <reading>ree</reading>l it in!" (おもり)
鞠:
  meaning: Ball
  primary_reading: まり
  reading_type: kunyomi
  meaning_mnemonic: >-
    Wrap a <radical>handful</radical> of stuffing in <radical>leather</radical> and stitch it up tight. Now you have a <kanji>ball</kanji> to kick around.
  reading_mnemonic: >-
    You toss the <kanji>ball</kanji> to your friend <reading>Mari</reading>o (まり), who jumps to catch it.
頌:
  meaning: Eulogy
  primary_reading: しょう
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>geoduck</radical> stands up in <radical>public</radical> and gives a long, beautiful speech praising someone. It is a <kanji>eulogy</kanji>.
  reading_mnemonic: >-
    The <kanji>eulogy</kanji> is so moving it turns into a whole <reading>show</reading> (しょう).
麟:
  meaning: Kirin
  primary_reading: りん
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>deer</radical> glows like <radical>phosphorus</radical> in the dark forest. It's no ordinary deer, it's a magical <kanji>kirin</kanji>, the Chinese unicorn.
  reading_mnemonic: >-
    The <kanji>kirin</kanji> wears a golden <reading>rin</reading>g (りん) on its horn. The <radical>phosphorus</radical> part gives the sound, just like 燐 (りん).
麿:
  meaning: I (Archaic)
  primary_reading: まろ
  reading_type: kunyomi
  meaning_mnemonic: >-
    A noble sits in a <radical>bathtub</radical> made of <radical>hemp</radical>, sipping tea and talking about himself. He says "<kanji>I</kanji>" in the oldest, fanciest way possible.
  reading_mnemonic: >-
    Whenever he says "<kanji>I</kanji>," he snacks on a <reading>marro</reading>w (まろ) cake. You'll see it at the end of old noble names.
