楼:
  meaning: Watchtower
  primary_reading: ろう
  reading_type: onyomi
  meaning_mnemonic: >-
    Someone stacks <radical>tree</radical> trunk on tree trunk, and a mysterious old <radical>surname</radical> is carved into the top beam. It grows so tall it becomes a <kanji>watchtower</kanji> where the whole family takes turns keeping lookout.
  reading_mnemonic: >-
    From the top of the <kanji>watchtower</kanji> the lookout spots a ship and shouts at everyone to <reading>row</reading> (ろう) faster toward the shore.
彬:
  meaning: Refined
  primary_reading: ひん
  reading_type: onyomi
  meaning_mnemonic: >-
    A scraggly <radical>forest</radical> is nothing special, but plant a few tall <radical>cedar</radical> trees among it in neat rows and suddenly it looks elegant and <kanji>refined</kanji>, like a fancy garden.
  reading_mnemonic: >-
    A <kanji>refined</kanji> lady walks through the garden, so polite she bows at every tree, bending at the <reading>hin</reading>ge (ひん) of her hips.
匡:
  meaning: Correct
  primary_reading: きょう
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>king</radical> has been locked in a <radical>cage</radical> for ruling badly. He stays there until he learns to <kanji>correct</kanji> his ways and set his kingdom right again.
  reading_mnemonic: >-
    To <kanji>correct</kanji> his mistakes, the caged king studies with a <reading>Kyo</reading>to (きょう) monk who teaches him how a good ruler behaves.
欽:
  meaning: Respect
  primary_reading: きん
  reading_type: onyomi
  meaning_mnemonic: >-
    You <radical>lack</radical> nothing but you still hand over your <radical>gold</radical> to the old master who taught you everything. It is your way of showing deep <kanji>respect</kanji>.
  reading_mnemonic: >-
    You show such <kanji>respect</kanji> that you treat the old master like <reading>kin</reading> (きん), part of your own family. The <radical>gold</radical> part gives the sound, since 金 is also read きん.
薪:
  meaning: Firewood
  primary_reading: まき
  reading_type: kunyomi
  meaning_mnemonic: >-
    The dry <radical>flowers</radical> and twigs are piled on top of a <radical>new</radical> stack of chopped logs. Everything is bundled together as <kanji>firewood</kanji> for the winter.
  reading_mnemonic: >-
    You toss the <kanji>firewood</kanji> onto the campfire and <reading>make</reading> (まき) a roaring blaze to cook dinner.
褐:
  meaning: Brown
  primary_reading: かつ
  reading_type: onyomi
  meaning_mnemonic: >-
    You put on your favorite <radical>outfit</radical> and someone asks <radical>why</radical> it is so dull. Because it was dyed the plainest, muddiest <kanji>brown</kanji> in the shop, of course.
  reading_mnemonic: >-
    The <kanji>brown</kanji> outfit is the same color as a crispy pork <reading>cutlet</reading> (かつ), so you look like a giant tonkatsu.
嵯:
  meaning: Craggy
  primary_reading: さ
  reading_type: onyomi
  meaning_mnemonic: >-
    One <radical>mountain</radical> stands out from the others thanks to a clear <radical>distinction</radical>: its sides are jagged and full of sharp rocks. It is the most <kanji>craggy</kanji> peak around.
  reading_mnemonic: >-
    Climbing the <kanji>craggy</kanji> peak, you slip and let out a long sad <reading>sigh</reading> (さ). The <radical>distinction</radical> part gives the sound, since 差 is read さ.
綜:
  meaning: Synthesize
  primary_reading: そう
  reading_type: onyomi
  meaning_mnemonic: >-
    Every <radical>religion</radical> has its own colored <radical>thread</radical>. A weaver pulls them all into one big tapestry to <kanji>synthesize</kanji> them into a single picture.
  reading_mnemonic: >-
    To <kanji>synthesize</kanji> all those threads, the weaver has to <reading>sew</reading> (そう) day and night. The <radical>religion</radical> part gives the sound, since 宗 is read そう.
繕:
  meaning: Mend
  primary_reading: ぜん
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>morally good</radical> neighbor sees the hole in your coat, grabs a needle and <radical>thread</radical>, and kindly offers to <kanji>mend</kanji> it for free.
  reading_mnemonic: >-
    While you <kanji>mend</kanji> the coat you sit in perfect calm, as patient as a <reading>Zen</reading> (ぜん) monk. The <radical>morally good</radical> part gives the sound, since 善 is read ぜん.
翠:
  meaning: Green
  primary_reading: すい
  reading_type: onyomi
  meaning_mnemonic: >-
    A kingfisher has the shiniest <radical>feathers</radical>. When it is ready to <radical>graduate</radical> from chick to adult, its feathers turn a bright jade <kanji>green</kanji>.
  reading_mnemonic: >-
    The <kanji>green</kanji> bird looks so cute that everyone says it is <reading>swee</reading>t (すい).
鮎:
  meaning: Sweetfish
  primary_reading: あゆ
  reading_type: kunyomi
  meaning_mnemonic: >-
    A <radical>fish</radical> goes to a <radical>fortune</radical> teller to learn its future. The teller says it will be grilled on a stick at a summer festival, because it is a tasty <kanji>sweetfish</kanji>.
  reading_mnemonic: >-
    The <kanji>sweetfish</kanji> gasps and asks, <reading>are you</reading> (あゆ) sure? The fortune teller nods and passes the salt.
榛:
  meaning: Hazel
  primary_reading: しん
  reading_type: onyomi
  meaning_mnemonic: >-
    The emperor of the <radical>Qin dynasty</radical> plants a special <radical>tree</radical> in his palace garden. Every autumn it drops little nuts, because it is a <kanji>hazel</kanji> tree.
  reading_mnemonic: >-
    Squirrels throw <kanji>hazel</kanji> nuts at the emperor and hit him right in the <reading>shin</reading> (しん). The <radical>Qin dynasty</radical> part gives the sound, since 秦 is read しん.
艶:
  meaning: Luster
  primary_reading: つや
  reading_type: kunyomi
  meaning_mnemonic: >-
    A <radical>plentiful</radical> amount of rich <radical>color</radical> gets painted on, coat after coat, until the surface shines with a deep <kanji>luster</kanji>.
  reading_mnemonic: >-
    The <kanji>luster</kanji> is so bright that the painter shouts "<reading>Tsu ya</reading> (つや) later, I need sunglasses!" and runs off.
惣:
  meaning: All
  primary_reading: そう
  reading_type: onyomi
  meaning_mnemonic: >-
    You love every single <radical>thing</radical> in your house with your whole <radical>heart</radical>. Not some of them, <kanji>all</kanji> of them.
  reading_mnemonic: >-
    You love <kanji>all</kanji> your things so much that you're <reading>so</reading> (そう) sad to throw anything away, even old side-dish containers.
蔦:
  meaning: Ivy
  primary_reading: つた
  reading_type: kunyomi
  meaning_mnemonic: >-
    A <radical>bird</radical> builds its nest high on a wall covered with climbing green <radical>flowers</radical>. The plant creeping up the bricks is <kanji>ivy</kanji>.
  reading_mnemonic: >-
    The <kanji>ivy</kanji> grows so fast it wraps around the bird, which squawks "<reading>Tsu-ta</reading> (つた)!" like a tiny alarm.
渚:
  meaning: Beach
  primary_reading: なぎさ
  reading_type: kunyomi
  meaning_mnemonic: >-
    <radical>Someone</radical> stands where the <radical>tsunami</radical> waves have finally calmed down and washed up onto the sand. They are standing on the <kanji>beach</kanji>.
  reading_mnemonic: >-
    On the <kanji>beach</kanji> a seagull keeps nagging you for snacks, crying "<reading>Naggy-sa</reading> (なぎさ)!" until you give in.
衷:
  meaning: Inner Heart
  primary_reading: ちゅう
  reading_type: onyomi
  meaning_mnemonic: >-
    Deep inside your <radical>clothes</radical> there's a <radical>mouth</radical> with a <radical>stick</radical> through it, holding a secret. That secret is what you really feel in your <kanji>inner heart</kanji>.
  reading_mnemonic: >-
    Your <kanji>inner heart</kanji> tells you to <reading>chew</reading> (ちゅう) on your feelings before saying anything out loud.
逐:
  meaning: Pursue
  primary_reading: ちく
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>pig</radical> steals your lunch and zooms away on a <radical>scooter</radical>. You hop on your own and <kanji>pursue</kanji> it all over town.
  reading_mnemonic: >-
    You <kanji>pursue</kanji> the pig until it finally drops the lunch, a <reading>chick</reading>en (ちく) sandwich.
斥:
  meaning: Reject
  primary_reading: せき
  reading_type: onyomi
  meaning_mnemonic: >-
    You swing your <radical>axe</radical> and a single <radical>drop</radical> of sweat flies off as you chop away every bad idea. You <kanji>reject</kanji> them all.
  reading_mnemonic: >-
    You <kanji>reject</kanji> the offer and then go drink some <reading>sake</reading> (せき) to celebrate.
稀:
  meaning: Rare
  primary_reading: まれ
  reading_type: kunyomi
  meaning_mnemonic: >-
    A farmer looks over the <radical>grain</radical> field and makes a <radical>wish</radical> for a golden stalk. It almost never happens, because golden grain is incredibly <kanji>rare</kanji>.
  reading_mnemonic: >-
    One day the <kanji>rare</kanji> golden stalk appears, and the farmer decides to <reading>marry</reading> (まれ) it on the spot.
芙:
  meaning: Lotus
  primary_reading: ふ
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>husband</radical> wants to impress his partner, so he finds the most beautiful pink <radical>flowers</radical> in the pond: a <kanji>lotus</kanji>.
  reading_mnemonic: >-
    He hands over the <kanji>lotus</kanji> and his partner says, "<reading>Who</reading> (ふ) is this from?" The <radical>husband</radical> part gives the sound, since 夫 is read ふ.
詔:
  meaning: Imperial Edict
  primary_reading: しょう
  reading_type: onyomi
  meaning_mnemonic: >-
    The emperor makes a <radical>call</radical> and the whole court must <radical>say</radical> his words back exactly. Whatever he declares this way is an <kanji>imperial edict</kanji>.
  reading_mnemonic: >-
    The <kanji>imperial edict</kanji> is read aloud like a big <reading>show</reading> (しょう) in the palace square. The <radical>call</radical> part gives the sound, since 召 is read しょう.
皐:
  meaning: Fifth Month
  primary_reading: さつき
  reading_type: kunyomi
  meaning_mnemonic: >-
    The <radical>white</radical> sun beats down on <radical>two</radical> rice paddies shaped like a <radical>cross</radical>. Farmers start planting, so it must be the <kanji>fifth month</kanji> of the old calendar.
  reading_mnemonic: >-
    In the <kanji>fifth month</kanji> a farmer <reading>sat</reading> down and <reading>key</reading>ed (さつき) in the planting plan on her phone.
雛:
  meaning: Chick
  primary_reading: ひな
  reading_type: kunyomi
  meaning_mnemonic: >-
    Someone is busy with <radical>grass cutting</radical> when a fluffy little <radical>turkey</radical> hops out of the clippings. It's a newborn <kanji>chick</kanji>.
  reading_mnemonic: >-
    The <kanji>chick</kanji> runs after you, so you whisper "<reading>hee-na</reading> (ひな)" to calm it, and it falls asleep.
惟:
  meaning: Consider
  primary_reading: い
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>turkey</radical> sits very still with its whole <radical>soul</radical> focused. It has to <kanji>consider</kanji> carefully whether to run before Thanksgiving.
  reading_mnemonic: >-
    After it <kanji>considers</kanji> everything, the turkey says "<reading>E</reading>asy (い), I'm leaving," and waddles away.
佑:
  meaning: Help
  primary_reading: ゆう
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>person</radical> stands at your <radical>right</radical> hand, always ready to step in. They are there to <kanji>help</kanji> you.
  reading_mnemonic: >-
    Your friend at your right side says, "Need <kanji>help</kanji>? I've got <reading>you</reading> (ゆう)." The <radical>right</radical> part gives the sound, since 右 is read ゆう.
耀:
  meaning: Shine
  primary_reading: よう
  reading_type: onyomi
  meaning_mnemonic: >-
    A bird from a noble family with a fancy <radical>surname</radical> flies straight into a beam of <radical>light</radical>. Its feathers start to <kanji>shine</kanji> and sparkle.
  reading_mnemonic: >-
    Everyone sees the bird <kanji>shine</kanji> and yells "<reading>Yo</reading> (よう), look at that!"
黛:
  meaning: Eyebrow Ink
  primary_reading: たい
  reading_type: onyomi
  meaning_mnemonic: >-
    You run out of makeup, so you <radical>substitute</radical> a stick of <radical>black</radical> charcoal and draw on your brows. That charcoal becomes your <kanji>eyebrow ink</kanji>.
  reading_mnemonic: >-
    You put on <kanji>eyebrow ink</kanji> and a <reading>tie</reading> (たい) for the party. The <radical>substitute</radical> part gives the sound, since 代 is read たい.
渥:
  meaning: Kindness
  primary_reading: あく
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>tsunami</radical> floods the town, but the owner of the <radical>shop</radical> opens its doors and hands out dry towels and food. That is real <kanji>kindness</kanji>.
  reading_mnemonic: >-
    The shop owner's <kanji>kindness</kanji> is so famous people shout "<reading>Ah, coo</reading>l (あく)!" every time they pass by.
宵:
  meaning: Evening
  primary_reading: よい
  reading_type: kunyomi
  meaning_mnemonic: >-
    Under the <radical>roof</radical>, the light fades and your shadow starts to bear a <radical>resemblance</radical> to a ghost. It is <kanji>evening</kanji>.
  reading_mnemonic: >-
    In the <kanji>evening</kanji> your friends come over and greet you with "<reading>Yo-ee</reading> (よい)!" ready for a fun night.
惇:
  meaning: Sincere
  primary_reading: じゅん
  reading_type: onyomi
  meaning_mnemonic: >-
    You <radical>receive</radical> a gift and say thank you with your whole <radical>soul</radical>. You aren't faking it at all, you are completely <kanji>sincere</kanji>.
  reading_mnemonic: >-
    Your <kanji>sincere</kanji> thank-you letter arrives in <reading>June</reading> (じゅん), right on time.
脩:
  meaning: Dried Meat
  primary_reading: しゅう
  reading_type: onyomi
  meaning_mnemonic: >-
    You feel very <radical>relaxed</radical> under the <radical>moon</radical> while strips of meat hang outside to dry all night. By morning you have <kanji>dried meat</kanji>.
  reading_mnemonic: >-
    The <kanji>dried meat</kanji> is so tough it feels like chewing an old <reading>shoe</reading> (しゅう).
甫:
  meaning: First Time
  primary_reading: ほ
  reading_type: onyomi
  meaning_mnemonic: >-
    You are given a <radical>task</radical> and add a single <radical>drop</radical> of ink to start it. It's the beginning, the very <kanji>first time</kanji> you've done it.
  reading_mnemonic: >-
    Doing something for the <kanji>first time</kanji> is scary, so you say "<reading>Ho</reading> (ほ) ho, here goes nothing!"
暉:
  meaning: Shine
  primary_reading: き
  reading_type: onyomi
  meaning_mnemonic: >-
    The <radical>sun</radical> rises over a marching <radical>army</radical> and bounces off every helmet and shield. The whole field starts to <kanji>shine</kanji>.
  reading_mnemonic: >-
    The armor <kanji>shines</kanji> so bright that a soldier uses it to find his lost <reading>key</reading> (き).
頒:
  meaning: Distribute
  primary_reading: はん
  reading_type: onyomi
  meaning_mnemonic: >-
    A giant <radical>geoduck</radical> cuts the cake into equal <radical>part</radical>s and hands them out to the crowd. It loves to <kanji>distribute</kanji> things fairly.
  reading_mnemonic: >-
    To <kanji>distribute</kanji> the cake, the geoduck uses its <reading>han</reading>d (はん) and gives everyone one piece.
只:
  meaning: Only
  primary_reading: ただ
  reading_type: kunyomi
  meaning_mnemonic: >-
    A <radical>mouth</radical> sits on <radical>eight</radical> tiny legs, but it can't eat anything big. It can <kanji>only</kanji> nibble one crumb at a time.
  reading_mnemonic: >-
    It <kanji>only</kanji> eats one crumb, then spreads its legs and says "<reading>Ta-da</reading> (ただ)!" like it did something amazing.
檀:
  meaning: Sandalwood
  primary_reading: だん
  reading_type: onyomi
  meaning_mnemonic: >-
    This <radical>tree</radical> <radical>truly</radical> smells amazing. Monks burn its wood as incense in the temple, because it's <kanji>sandalwood</kanji>.
  reading_mnemonic: >-
    The smell of <kanji>sandalwood</kanji> is so nice that the monks start to <reading>dan</reading>ce (だん). The <radical>truly</radical> part gives the sound, since 亶 is read だん.
凱:
  meaning: Victory Song
  primary_reading: がい
  reading_type: onyomi
  meaning_mnemonic: >-
    The soldiers come home and jump on the <radical>table</radical> with a cry of surprise, "<radical>What?!</radical> We won!" Then they all start singing a <kanji>victory song</kanji>.
  reading_mnemonic: >-
    The loudest <kanji>victory song</kanji> comes from one huge <reading>guy</reading> (がい) who stands on the table.
彗:
  meaning: Comet
  primary_reading: すい
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>hand</radical> holding an <radical>abundant</radical> bushy broom sweeps across the night sky, leaving a sparkly trail behind it. That's a <kanji>comet</kanji>.
  reading_mnemonic: >-
    The <kanji>comet</kanji> swoops by and everyone says how <reading>swee</reading>t (すい) it looks.
謄:
  meaning: Copy
  primary_reading: とう
  reading_type: onyomi
  meaning_mnemonic: >-
    The emperor speaks in the <radical>majestic plural</radical>, and scribes must <radical>say</radical> every word back while writing it down. They make an exact <kanji>copy</kanji> of every document.
  reading_mnemonic: >-
    The scribes <kanji>copy</kanji> so much that they get cramps all the way down to their <reading>toe</reading>s (とう).
丑:
  meaning: Ox (Zodiac)
  primary_reading: うし
  reading_type: kunyomi
  meaning_mnemonic: >-
    A big hook-shaped hand pushes down on the <radical>ground</radical>, plowing the field. That's the strong animal of the second zodiac sign, the <kanji>ox</kanji>.
  reading_mnemonic: >-
    The <kanji>ox</kanji> pulls the plow while the farmer yells "<reading>Oo, she</reading> (うし) is strong!"
嗣:
  meaning: Heir
  primary_reading: し
  reading_type: onyomi
  meaning_mnemonic: >-
    The old <radical>director</radical> points at the <radical>bookshelf</radical> of company records and, with his own <radical>mouth</radical>, names the person who will take over. That person is his <kanji>heir</kanji>.
  reading_mnemonic: >-
    Everyone is shocked, because the <kanji>heir</kanji> is a <reading>she</reading> (し) nobody expected. The <radical>director</radical> part gives the sound, since 司 is read し.
汐:
  meaning: Tide
  primary_reading: しお
  reading_type: kunyomi
  meaning_mnemonic: >-
    In the <radical>evening</radical> the <radical>tsunami</radical> water slowly creeps back up the beach. That's the evening <kanji>tide</kanji> coming in.
  reading_mnemonic: >-
    The <kanji>tide</kanji> brings a cute little fish that calls out "<reading>She-oh</reading> (しお)!" to say hello.
絢:
  meaning: Brilliant Fabric
  primary_reading: けん
  reading_type: onyomi
  meaning_mnemonic: >-
    When the flowers are <radical>in season</radical>, a weaver copies their colors with shiny <radical>thread</radical>. The result is a <kanji>brilliant fabric</kanji> that dazzles everyone.
  reading_mnemonic: >-
    The <kanji>brilliant fabric</kanji> is so pretty that <reading>Ken</reading> (けん) the doll wants a suit made from it.
