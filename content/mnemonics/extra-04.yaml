朔:
  meaning: New Moon
  primary_reading: さく
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>disobedient</radical> little <radical>moon</radical> refuses to shine at all and hides its whole face in the dark. The night it sulks like this is the first day of the month, the <kanji>new moon</kanji>.
  reading_mnemonic: >-
    To lure the sulking moon out for the <kanji>new moon</kanji>, you hold up a <reading>sack</reading> (さく) full of glowing candy. It peeks, but it stays stubborn.
伽:
  meaning: Attending
  primary_reading: か
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>person</radical> keeps <radical>add</radical>ing pillows, tea and bedtime stories to the sick lord's room. They never leave his side, always <kanji>attending</kanji> to him.
  reading_mnemonic: >-
    While <kanji>attending</kanji> the lord, the servant hears him cough and cries "<reading>Ca</reading>reful (か), my lord!" The <radical>add</radical> part gives the sound, just like 加 (か).
畝:
  meaning: Furrow
  primary_reading: うね
  reading_type: kunyomi
  meaning_mnemonic: >-
    A farmer puts a <radical>lid</radical> over his <radical>rice paddy</radical> and plows it for a <radical>long time</radical>. When he lifts the lid, the field is striped with neat raised ridges, each with a <kanji>furrow</kanji> beside it.
  reading_mnemonic: >-
    The farmer looks at his crooked <kanji>furrow</kanji> and groans, "Oh, <reading>oon-neh</reading> (うね), that one is wobbly!" He straightens it, grumbling.
抄:
  meaning: Extract
  primary_reading: しょう
  reading_type: onyomi
  meaning_mnemonic: >-
    Your <radical>fingers</radical> pick out just a <radical>few</radical> lines from a giant book. You copy only the good bits and leave the rest, making an <kanji>extract</kanji>.
  reading_mnemonic: >-
    You read your <kanji>extract</kanji> out loud on stage like a little <reading>show</reading> (しょう). The <radical>few</radical> part gives the sound, just like 少 (しょう).
黎:
  meaning: Dark
  primary_reading: れい
  reading_type: onyomi
  meaning_mnemonic: >-
    You stash a sack of <radical>millet</radical> deep inside a <radical>prison</radical> cell with no windows. Without any light, it sits there in the <kanji>dark</kanji>, just before dawn.
  reading_mnemonic: >-
    In the <kanji>dark</kanji> cell, a single <reading>ray</reading> (れい) of morning light finally slips through the bars. Dawn is coming.
冴:
  meaning: Clear
  primary_reading: さ
  reading_type: kunyomi
  meaning_mnemonic: >-
    A walrus bites into a block of <radical>ice</radical> with its <radical>fang</radical>, and the cold snaps it wide awake. Its head feels sharp, cold and <kanji>clear</kanji>.
  reading_mnemonic: >-
    With its mind now <kanji>clear</kanji>, the walrus tells you, "<reading>Sa</reading>y (さ) what you want, I'm wide awake now!" Remember 冴える (さえる), to be clear and sharp.
旺:
  meaning: Flourishing
  primary_reading: おう
  reading_type: onyomi
  meaning_mnemonic: >-
    The <radical>sun</radical> shines down on the <radical>king</radical> every single day. His crops grow, his people smile, and his kingdom is <kanji>flourishing</kanji>.
  reading_mnemonic: >-
    Seeing his <kanji>flourishing</kanji> kingdom, the king can only say "<reading>Oh</reading> (おう), wow!" over and over.
偲:
  meaning: Recollect
  primary_reading: しの
  reading_type: kunyomi
  meaning_mnemonic: >-
    A <radical>person</radical> sits quietly and <radical>think</radical>s about an old friend who moved far away. They smile as they <kanji>recollect</kanji> the good old days.
  reading_mnemonic: >-
    As they <kanji>recollect</kanji> the past, they say, "<reading>She know</reading>s (しの) how much I miss her." Remember 偲ぶ (しのぶ), to fondly remember someone.
壱:
  meaning: One
  primary_reading: いち
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>samurai</radical> with a big <radical>forehead</radical> holds a single <radical>spoon</radical>. He only needs <kanji>one</kanji>, and he writes it this fancy way on official documents so nobody can fake it.
  reading_mnemonic: >-
    The samurai's <kanji>one</kanji> spoon makes him <reading>itch</reading> (いち) to eat, just like the plain 一 (いち).
允:
  meaning: Permit
  primary_reading: いん
  reading_type: onyomi
  meaning_mnemonic: >-
    You keep your <radical>private</radical> papers tucked under your arm while your <radical>legs</radical> walk up to the guard. He reads them, nods, and gives you a <kanji>permit</kanji>.
  reading_mnemonic: >-
    With your <kanji>permit</kanji> in hand, you are finally let <reading>in</reading> (いん). The gate swings open.
侯:
  meaning: Marquis
  primary_reading: こう
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>person</radical> who can shoot an <radical>arrow</radical> better than anyone is rewarded with land and a fancy title. Bow down, he is now a <kanji>marquis</kanji>.
  reading_mnemonic: >-
    The new <kanji>marquis</kanji> shows off his fine velvet <reading>coa</reading>t (こう) to everyone at court.
蒔:
  meaning: Sow
  primary_reading: ま
  reading_type: kunyomi
  meaning_mnemonic: >-
    You toss <radical>flowers</radical> seeds onto the soil, because now is the right <radical>time</radical> of year. It's planting season, time to <kanji>sow</kanji>.
  reading_mnemonic: >-
    While you <kanji>sow</kanji> the seeds, your <reading>ma</reading> (ま) runs behind you scattering more. Remember 蒔く (まく), to sow.
矩:
  meaning: Carpenter's Square
  primary_reading: く
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>giant</radical> needs a perfectly straight <radical>arrow</radical> to measure his house, so he bends one into an L shape. Now he has a <kanji>carpenter's square</kanji> for marking right angles.
  reading_mnemonic: >-
    The giant uses his <kanji>carpenter's square</kanji> to <reading>coo</reading>k (く) up perfect rectangles. Remember 矩形 (くけい), rectangle.
舜:
  meaning: Morning Glory
  primary_reading: しゅん
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>cleat</radical> stomps on someone's <radical>forehead</radical>, and they jump up to <radical>dance</radical> in pain. Where they dance, a pretty flower pops open each morning, a <kanji>morning glory</kanji>.
  reading_mnemonic: >-
    The <kanji>morning glory</kanji> blooms only for a moment before it starts to <reading>shun</reading> (しゅん) the sun and close again.
附:
  meaning: Attached
  primary_reading: ふ
  reading_type: onyomi
  meaning_mnemonic: >-
    A little shed sits on a <radical>hill</radical>, and you <radical>attach</radical> it to the big castle with a long rope. It is now officially <kanji>attached</kanji>.
  reading_mnemonic: >-
    The <kanji>attached</kanji> shed sways and you shout "<reading>Fu</reading>! (ふ)" with relief when it holds. The <radical>attach</radical> part gives the sound, just like 付 (ふ).
彪:
  meaning: Spotted
  primary_reading: ひょう
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>tiger</radical> grows wild new <radical>hair</radical> all over its body. Instead of stripes, the fur comes in dots, and now it is <kanji>spotted</kanji>.
  reading_mnemonic: >-
    The <kanji>spotted</kanji> tiger looks so much like a leopard that everyone calls it 豹 (<reading>hyo</reading>, ひょう).
卯:
  meaning: Rabbit (Zodiac)
  primary_reading: う
  reading_type: kunyomi
  meaning_mnemonic: >-
    A rabbit takes a <radical>slide</radical> down the hill and lands on a <radical>stamp</radical>, which prints two big floppy ears on the page. It's the official seal for the year of the <kanji>rabbit (zodiac)</kanji>.
  reading_mnemonic: >-
    When the <kanji>rabbit (zodiac)</kanji> sees its ears stamped on the page, it says "<reading>Ooh</reading> (う), cute!"
但:
  meaning: However
  primary_reading: ただ
  reading_type: kunyomi
  meaning_mnemonic: >-
    A <radical>person</radical> promises to wake up at <radical>dawn</radical>. <kanji>However</kanji>, the alarm rings and they roll right back over.
  reading_mnemonic: >-
    "<kanji>However</kanji>," they say, waving a hand, "<reading>ta-da</reading> (ただ), I'm awake now!" Remember 但し (ただし), however.
皓:
  meaning: White
  primary_reading: こう
  reading_type: onyomi
  meaning_mnemonic: >-
    A herald stands on the castle wall to <radical>announce</radical> something, wearing a robe so <radical>white</radical> it glows in the moonlight. It's a bright, shining <kanji>white</kanji>.
  reading_mnemonic: >-
    The herald's shining <kanji>white</kanji> robe is actually a fancy <reading>coa</reading>t (こう) that he polishes every night.
洸:
  meaning: Sparkling Water
  primary_reading: こう
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>tsunami</radical> crashes into the shore, and the <radical>light</radical> of the sun hits every drop. The whole bay glitters like <kanji>sparkling water</kanji>.
  reading_mnemonic: >-
    The <kanji>sparkling water</kanji> splashes onto your <reading>coa</reading>t (こう). The <radical>light</radical> part gives the sound, just like 光 (こう).
毬:
  meaning: Ball
  primary_reading: まり
  reading_type: kunyomi
  meaning_mnemonic: >-
    You gather <radical>fur</radical> because a child made a <radical>request</radical> for a toy. You wrap it up tight into a soft, round, bouncy <kanji>ball</kanji>.
  reading_mnemonic: >-
    The child's friend <reading>Mari</reading> (まり) grabs the <kanji>ball</kanji> and kicks it over the fence.
鯛:
  meaning: Sea Bream
  primary_reading: たい
  reading_type: kunyomi
  meaning_mnemonic: >-
    A big red <radical>fish</radical> swims around the <radical>circumference</radical> of the bay, showing off. It's the lucky party fish of Japan, the <kanji>sea bream</kanji>.
  reading_mnemonic: >-
    The <kanji>sea bream</kanji> is so fancy it wears a little <reading>tie</reading> (たい) to every celebration.
怜:
  meaning: Wise
  primary_reading: れい
  reading_type: onyomi
  meaning_mnemonic: >-
    Your <radical>soul</radical> gives you calm <radical>orders</radical> whenever you are about to do something dumb. Listening to it makes you <kanji>wise</kanji>.
  reading_mnemonic: >-
    A <kanji>wise</kanji> person always sees a <reading>ray</reading> (れい) of light in every problem. The <radical>orders</radical> part gives the sound, just like 令 (れい).
邑:
  meaning: Village
  primary_reading: ゆう
  reading_type: onyomi
  meaning_mnemonic: >-
    Every house has one big <radical>mouth</radical> for a door and one cozy <radical>bed</radical> inside. Put a bunch of those houses together and you get a little <kanji>village</kanji>.
  reading_mnemonic: >-
    Everybody in the <kanji>village</kanji> knows <reading>you</reading> (ゆう) and waves when you walk by.
倣:
  meaning: Imitate
  primary_reading: ほう
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>person</radical> watches you <radical>release</radical> a bird into the sky, then grabs their own bird and does exactly the same thing. They <kanji>imitate</kanji> everything you do.
  reading_mnemonic: >-
    You shout "<reading>Ho</reading> (ほう), stop it!" but they <kanji>imitate</kanji> that too. The <radical>release</radical> part gives the sound, just like 放 (ほう).
碧:
  meaning: Blue Green
  primary_reading: へき
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>king</radical> finds a <radical>white</radical> <radical>stone</radical> at the beach, but when he holds it up to the sea it shines a deep jewel color. It's a perfect <kanji>blue green</kanji>.
  reading_mnemonic: >-
    The king loves the <kanji>blue green</kanji> stone so much he yells "<reading>Heck</reading> (へき) yes, it's mine!"
啄:
  meaning: Peck
  primary_reading: たく
  reading_type: onyomi
  meaning_mnemonic: >-
    A bird opens its <radical>mouth</radical> and goes after a <radical>pig</radical>'s snack. Again and again, it starts to <kanji>peck</kanji> at the food.
  reading_mnemonic: >-
    Each <kanji>peck</kanji> sounds like "<reading>tak</reading> (たく), tak, tak" on the trough. The pig is not amused.
穣:
  meaning: Good Crops
  primary_reading: じょう
  reading_type: onyomi
  meaning_mnemonic: >-
    You plant <radical>grain</radical> in <radical>six</radical> rows, water it <radical>three</radical> times a day, and wrap it in a warm <radical>robe</radical> at night. All that care pays off with heaps of <kanji>good crops</kanji>.
  reading_mnemonic: >-
    Your <kanji>good crops</kanji> are so huge you can't stop telling <reading>jo</reading>kes (じょう) while you harvest them.
酉:
  meaning: Bird (Zodiac)
  primary_reading: とり
  reading_type: kunyomi
  meaning_mnemonic: >-
    A rooster flies to the <radical>west</radical> and lands on the <radical>ground</radical> with a big flap. It crows loudly because it's the <kanji>bird (zodiac)</kanji> sign.
  reading_mnemonic: >-
    The <kanji>bird (zodiac)</kanji> is a 鳥 (<reading>tori</reading>, とり), of course. It insists you remember it.
悌:
  meaning: Respect for Elders
  primary_reading: てい
  reading_type: onyomi
  meaning_mnemonic: >-
    Your <radical>soul</radical> reminds the <radical>younger brother</radical> to bow, help, and listen to the older kids. That's <kanji>respect for elders</kanji>.
  reading_mnemonic: >-
    The younger brother shows <kanji>respect for elders</kanji> by politely saying "<reading>Tay</reading> (てい), let me carry that for you." The <radical>younger brother</radical> part gives the sound, just like 弟 (てい).
柚:
  meaning: Yuzu
  primary_reading: ゆず
  reading_type: kunyomi
  meaning_mnemonic: >-
    A <radical>tree</radical> grows sour little yellow fruits for a very good <radical>reason</radical>: to flavor your ponzu. It's the citrus called <kanji>yuzu</kanji>.
  reading_mnemonic: >-
    "<reading>You use</reading> (ゆず) a <kanji>yuzu</kanji> for everything," your friend complains, squeezing it over the soup.
繭:
  meaning: Cocoon
  primary_reading: まゆ
  reading_type: kunyomi
  meaning_mnemonic: >-
    In the <radical>flowers</radical>, an <radical>insect</radical> wraps its <radical>head</radical> in fine <radical>thread</radical>, round and round. Soon it's tucked inside a silky <kanji>cocoon</kanji>.
  reading_mnemonic: >-
    From inside the <kanji>cocoon</kanji>, a tiny voice asks, "<reading>May you</reading> (まゆ) let me sleep a bit longer?"
丙:
  meaning: Third Class
  primary_reading: へい
  reading_type: onyomi
  meaning_mnemonic: >-
    You stand on the <radical>ground</radical> floor looking <radical>inside</radical> the cheapest train car. No seats, no windows, just hay. This is <kanji>third class</kanji>.
  reading_mnemonic: >-
    In <kanji>third class</kanji>, you sit on a pile of <reading>hay</reading> (へい) with the goats.
冶:
  meaning: Smelting
  primary_reading: や
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>machine</radical> melts metal ore, and you pour it into molds and cool it with <radical>ice</radical>. Hot then cold, hot then cold, this is <kanji>smelting</kanji>.
  reading_mnemonic: >-
    Every time the <kanji>smelting</kanji> machine pours, the workers cheer "<reading>Ya</reading>y (や)!" Remember 冶金 (やきん), metallurgy.
吏:
  meaning: Official
  primary_reading: り
  reading_type: onyomi
  meaning_mnemonic: >-
    A man of great <radical>height</radical> opens his loud <radical>mouth</radical> to read the new laws to the town. He's the government <kanji>official</kanji>.
  reading_mnemonic: >-
    The tall <kanji>official</kanji> reads from a <reading>ree</reading>l (り) of paper that rolls all the way down the street.
塑:
  meaning: Model
  primary_reading: そ
  reading_type: onyomi
  meaning_mnemonic: >-
    Under the <radical>new moon</radical>, a sculptor scoops up wet <radical>dirt</radical> and squishes it into shape. By morning he has a clay <kanji>model</kanji>.
  reading_mnemonic: >-
    The clay <kanji>model</kanji> is still wet, so the sculptor has to <reading>so</reading>ak (そ) his hands afterwards. Remember 彫塑 (ちょうそ), sculpture.
墾:
  meaning: Open Up Land
  primary_reading: こん
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>badger</radical> digs up every <radical>root</radical> in the wild <radical>dirt</radical>. Bit by bit, it clears the field so farmers can <kanji>open up land</kanji> for crops.
  reading_mnemonic: >-
    The badger is so proud after it helps <kanji>open up land</kanji> that it eats a whole ice cream <reading>con</reading>e (こん). Remember 開墾 (かいこん), land clearing.
弐:
  meaning: Two
  primary_reading: に
  reading_type: onyomi
  meaning_mnemonic: >-
    At a fancy <radical>ceremony</radical> on the <radical>ground</radical>, a clerk writes the number <radical>two</radical> in a special style so nobody can change it on the contract. It's <kanji>two</kanji>, the official way.
  reading_mnemonic: >-
    The official <kanji>two</kanji> is still read like <reading>knee</reading> (に), just like plain 二. The <radical>two</radical> part gives the sound.
朕:
  meaning: Imperial We
  primary_reading: ちん
  reading_type: onyomi
  meaning_mnemonic: >-
    The emperor stands under the <radical>moon</radical> and points to the <radical>heaven</radical>. He's so grand that he never says "I", only the <kanji>imperial we</kanji>.
  reading_mnemonic: >-
    Using the <kanji>imperial we</kanji>, the emperor lifts his <reading>chin</reading> (ちん) way up high.
濫:
  meaning: Excessive
  primary_reading: らん
  reading_type: onyomi
  meaning_mnemonic: >-
    You were supposed to <radical>oversee</radical> the <radical>tsunami</radical> defenses, but you let in way too much water. Everything floods. It's <kanji>excessive</kanji>.
  reading_mnemonic: >-
    The water is so <kanji>excessive</kanji> that everyone <reading>ran</reading> (らん) for the hills.
爵:
  meaning: Peerage
  primary_reading: しゃく
  reading_type: onyomi
  meaning_mnemonic: >-
    A noble wearing <radical>cleat</radical>s stands on a <radical>net</radical> over a twisted <radical>root</radical> while a servant takes his <radical>measurement</radical> for a crown. Only lords and barons get this treatment, the <kanji>peerage</kanji>.
  reading_mnemonic: >-
    When the members of the <kanji>peerage</kanji> see the price of the crown, they're <reading>shock</reading>ed (しゃく). Remember 男爵 (だんしゃく), baron.
璽:
  meaning: Imperial Seal
  primary_reading: じ
  reading_type: onyomi
  meaning_mnemonic: >-
    "<radical>You</radical> there, bring me the <radical>ball</radical> of jade!" the emperor says. It's carved into the stamp he uses on every law, the <kanji>imperial seal</kanji>.
  reading_mnemonic: >-
    The <kanji>imperial seal</kanji> is so heavy it needs a <reading>jee</reading>p (じ) to carry it around the palace.
痘:
  meaning: Pox
  primary_reading: とう
  reading_type: onyomi
  meaning_mnemonic: >-
    You get <radical>sick</radical> and little red bumps the size of <radical>beans</radical> pop up all over your skin. Oh no, it's the <kanji>pox</kanji>.
  reading_mnemonic: >-
    The <kanji>pox</kanji> even spreads to your <reading>toe</reading> (とう)s. The <radical>beans</radical> part gives the sound, just like 豆 (とう).
箇:
  meaning: Counter for Articles
  primary_reading: か
  reading_type: onyomi
  meaning_mnemonic: >-
    You line up items inside <radical>bamboo</radical> boxes so <radical>hard</radical> and sturdy they never break. Then you count them one by one with the <kanji>counter for articles</kanji>.
  reading_mnemonic: >-
    You use the <kanji>counter for articles</kanji> on every box you load into your <reading>ca</reading>r (か). Remember 箇所 (かしょ), place or spot.
