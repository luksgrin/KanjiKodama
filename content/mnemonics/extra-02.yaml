寅:
  meaning: Tiger (Zodiac)
  primary_reading: とら
  reading_type: kunyomi
  meaning_mnemonic: >-
    Under a <radical>roof</radical> sits a cage with a sign giving the <radical>reason</radical> it is there, propped up on <radical>eight</radical> sturdy legs. The reason is simple: inside paces the zodiac <kanji>tiger</kanji>.
  reading_mnemonic: >-
    The zodiac <kanji>tiger</kanji> is restless, so the zookeeper rolls in a <reading>tora</reading>mpoline (とら) for it to bounce on. Tigers love trampolines.
洲:
  meaning: Sandbar
  primary_reading: しゅう
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>tsunami</radical> crashes over a whole <radical>state</radical>, and when the water drains away only a long strip of sand is left poking out. The state has become a <kanji>sandbar</kanji>.
  reading_mnemonic: >-
    You walk across the <kanji>sandbar</kanji> and the wet sand sucks off your <reading>shoe</reading> (しゅう). The <radical>state</radical> part gives the sound, just like 州.
樺:
  meaning: Birch
  primary_reading: かば
  reading_type: kunyomi
  meaning_mnemonic: >-
    This <radical>tree</radical> is so <radical>showy</radical> with its bright white bark that it stands out from the whole forest. That flashy white tree is the <kanji>birch</kanji>.
  reading_mnemonic: >-
    A <reading>caba</reading>ret dancer (かば) loves the <kanji>birch</kanji> so much she dances around its white trunk every night. 白樺 is the white birch.
槙:
  meaning: Podocarp
  primary_reading: まき
  reading_type: kunyomi
  meaning_mnemonic: >-
    This <radical>tree</radical> stays green all year long, which is its <radical>reality</radical>: it never drops its needles. It is the evergreen <kanji>podocarp</kanji>, planted in gardens and hedges.
  reading_mnemonic: >-
    The gardener trims the <kanji>podocarp</kanji> hedge into a fancy shape and says, "Let me <reading>make</reading> (まき) you a dragon." He loves to make things out of it.
巌:
  meaning: Crag
  primary_reading: いわ
  reading_type: kunyomi
  meaning_mnemonic: >-
    On top of a <radical>mountain</radical> stands a huge, <radical>strict</radical>-looking rock that nobody dares to climb. It frowns down at everyone like a stern teacher. That giant rock is a <kanji>crag</kanji>.
  reading_mnemonic: >-
    You look up at the <kanji>crag</kanji> and say, "<reading>Ew, wa</reading>it (いわ), is that rock frowning at me?" It is the same いわ as the ordinary rock, 岩, just much bigger and grumpier.
峻:
  meaning: Steep
  primary_reading: しゅん
  reading_type: onyomi
  meaning_mnemonic: >-
    You get a <radical>license</radical> to climb the <radical>mountain</radical>, but it is <radical>winter</radical> and the slope is iced over. Every step tilts you backward because the climb is so <kanji>steep</kanji>.
  reading_mnemonic: >-
    The slope is so <kanji>steep</kanji> that everyone tries to <reading>shun</reading> (しゅん) it. Even the mountain goats shun this path.
槻:
  meaning: Zelkova
  primary_reading: つき
  reading_type: kunyomi
  meaning_mnemonic: >-
    This <radical>tree</radical> is the <radical>standard</radical> that all the other trees in the village are measured against, tall and wide with a perfect crown. It is the mighty <kanji>zelkova</kanji>.
  reading_mnemonic: >-
    At night the <reading>tsuki</reading> (つき), the moon, rises right behind the <kanji>zelkova</kanji>, so the villagers call it the moon tree.
琢:
  meaning: Polish
  primary_reading: たく
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>king</radical> owns a jewel, but his <radical>pig</radical> keeps rolling it in the mud. Every evening the king has to sit down and <kanji>polish</kanji> it clean again.
  reading_mnemonic: >-
    To <kanji>polish</kanji> the jewel, the king uses a little <reading>tack</reading> (たく) cloth. Think of 琢磨, polishing yourself through hard work.
蕉:
  meaning: Banana Plant
  primary_reading: しょう
  reading_type: onyomi
  meaning_mnemonic: >-
    Giant <radical>flowers</radical> and leaves grow so close to the jungle fire that their edges are <radical>char</radical>red. They are tough enough to survive, because they belong to the big leafy <kanji>banana plant</kanji>.
  reading_mnemonic: >-
    A monkey climbs the <kanji>banana plant</kanji> and puts on a <reading>show</reading> (しょう) with the bananas. The <radical>char</radical> part gives the sound, just like 焦.
琉:
  meaning: Lapis Lazuli
  primary_reading: りゅう
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>king</radical> lifts the <radical>lid</radical> of his <radical>private</radical> chest beside a <radical>river</radical>. Inside glows a deep blue gem, the colour of the river itself. It is <kanji>lapis lazuli</kanji>.
  reading_mnemonic: >-
    The king calls the gem his blue <reading>Ryu</reading> (りゅう), his little dragon, because the <kanji>lapis lazuli</kanji> shines like dragon scales. You see it in 琉球, the old name of Okinawa.
朋:
  meaning: Companion
  primary_reading: とも
  reading_type: kunyomi
  meaning_mnemonic: >-
    Two <radical>moon</radical>s sit side by side in the sky, keeping each other company all night long. They are each other's <kanji>companion</kanji>.
  reading_mnemonic: >-
    The two <kanji>companion</kanji> moons promise to meet again <reading>tomo</reading>rrow (とも). Good friends always come back tomorrow.
橘:
  meaning: Mandarin Orange
  primary_reading: たちばな
  reading_type: kunyomi
  meaning_mnemonic: >-
    You <radical>bore with an awl</radical> into the bark of a little <radical>tree</radical>, and sweet juice squirts out. The tree is covered in small orange fruit. It is the wild <kanji>mandarin orange</kanji>.
  reading_mnemonic: >-
    You hand a <kanji>mandarin orange</kanji> to a friend and say, "<reading>Touch a banana</reading> (たちばな) and it will turn into one of these!" It is the traditional Japanese tachibana orange.
漱:
  meaning: Gargle
  primary_reading: そう
  reading_type: onyomi
  meaning_mnemonic: >-
    You take a <radical>tsunami</radical> of water, wrap it in a <radical>bundle</radical>, and stuff it in your mouth, but you <radical>lack</radical> the will to swallow. So you tip your head back and <kanji>gargle</kanji>.
  reading_mnemonic: >-
    You <kanji>gargle</kanji> so hard your throat feels <reading>sore</reading> (そう). Too much gargling makes anyone sore.
苑:
  meaning: Garden
  primary_reading: えん
  reading_type: onyomi
  meaning_mnemonic: >-
    <radical>Flowers</radical> bloom in the <radical>evening</radical>, and at the gate a guard puts a <radical>stamp</radical> on your ticket. You have entered the royal <kanji>garden</kanji>.
  reading_mnemonic: >-
    You wander the <kanji>garden</kanji> until the very <reading>en</reading>d (えん) of the path. Think of 御苑, the imperial garden in Shinjuku.
巽:
  meaning: Southeast
  primary_reading: たつみ
  reading_type: kunyomi
  meaning_mnemonic: >-
    You tell <radical>oneself</radical> twice, side by side, to stand <radical>together</radical> and face the morning sun as it climbs. That direction, between the sunrise and the noon sun, is the <kanji>southeast</kanji>.
  reading_mnemonic: >-
    In the old zodiac compass the <kanji>southeast</kanji> sits between the dragon and the snake, <reading>tatsu</reading> and <reading>mi</reading> (たつみ). Dragon plus snake gives you southeast.
杜:
  meaning: Grove
  primary_reading: もり
  reading_type: kunyomi
  meaning_mnemonic: >-
    A <radical>tree</radical> grows out of the <radical>dirt</radical>, then another, and another, around a little shrine. Soon the shrine is wrapped in a quiet sacred <kanji>grove</kanji>.
  reading_mnemonic: >-
    You want <reading>more</reading> (もり) trees, so the <kanji>grove</kanji> keeps growing. It shares the reading もり with 森, the forest.
翁:
  meaning: Old Man
  primary_reading: おう
  reading_type: onyomi
  meaning_mnemonic: >-
    In the <radical>public</radical> square sits someone with a beard as white and fluffy as <radical>feathers</radical>. Everyone bows to the venerable <kanji>old man</kanji>.
  reading_mnemonic: >-
    Every time the <kanji>old man</kanji> stands up his knees go "<reading>Oh</reading>" (おう). Poor old knees.
欣:
  meaning: Rejoice
  primary_reading: きん
  reading_type: onyomi
  meaning_mnemonic: >-
    A lumberjack has been swinging his <radical>axe</radical> all day and is so tired he can't stop yawning, which looks like he <radical>lack</radical>s energy. Then he hears the work is finally done, and he opens his mouth wide to <kanji>rejoice</kanji>.
  reading_mnemonic: >-
    He shouts with joy, "I'm the <reading>kin</reading>g (きん) of lumberjacks!" as he goes on to <kanji>rejoice</kanji>. The <radical>axe</radical> part gives the sound, just like 斤.
窯:
  meaning: Kiln
  primary_reading: かま
  reading_type: kunyomi
  meaning_mnemonic: >-
    A <radical>hole</radical> dug in the hillside glows red hot. A <radical>lamb</radical> wanders in and comes out as a perfectly baked clay figurine. That hot hole is a <kanji>kiln</kanji>.
  reading_mnemonic: >-
    The potter stands at the <kanji>kiln</kanji> door and yells "<reading>Come a</reading>... (かま)" and then the heat knocks the words out of him. 窯元 is a pottery workshop with its own kiln.
巴:
  meaning: Swirl
  primary_reading: ともえ
  reading_type: kunyomi
  meaning_mnemonic: >-
    <radical>Oneself</radical> curls up into a tight comma shape and starts spinning around and around. You become a <kanji>swirl</kanji>, the comma-shaped pattern on taiko drums.
  reading_mnemonic: >-
    The <kanji>swirl</kanji> keeps spinning until <reading>tomo</reading>rrow, <reading>eh</reading> (ともえ)? It's the tomoe pattern you see on shrine drums.
禎:
  meaning: Good Fortune
  primary_reading: てい
  reading_type: onyomi
  meaning_mnemonic: >-
    You kneel at the <radical>altar</radical> and pray with a pure, <radical>chastity</radical>-like heart. The gods are pleased and grant you <kanji>good fortune</kanji>.
  reading_mnemonic: >-
    Your <kanji>good fortune</kanji> arrives on a silver <reading>tray</reading> (てい). The <radical>chastity</radical> part gives the sound, just like 貞.
稜:
  meaning: Ridge
  primary_reading: りょう
  reading_type: onyomi
  meaning_mnemonic: >-
    <radical>Grain</radical> grows only on the lower slopes, because higher up you get <radical>frostbite</radical>. Above that there's just a sharp, cold edge against the sky: the mountain <kanji>ridge</kanji>.
  reading_mnemonic: >-
    You walk along the <kanji>ridge</kanji> to a little <reading>ryo</reading>kan (りょう) at the top. The <radical>frostbite</radical> part gives the sound, just like 陵.
倭:
  meaning: Ancient Japan
  primary_reading: わ
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>person</radical> is sent by a <radical>committee</radical> of old Chinese scholars to describe the islands to the east. He writes down the name they used for <kanji>ancient Japan</kanji>.
  reading_mnemonic: >-
    The traveler steps ashore in <kanji>ancient Japan</kanji> and says "<reading>Wa</reading>h (わ)!" at the view. It is the same わ as 和, Japanese style. 倭人 are the people of old Wa.
魁:
  meaning: Pioneer
  primary_reading: かい
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>demon</radical> grabs a <radical>ladle</radical> and charges ahead of everyone else into the unknown, swinging it like a sword. Ahead of the whole army, it is the <kanji>pioneer</kanji>.
  reading_mnemonic: >-
    The <kanji>pioneer</kanji> demon soars ahead of the army like a <reading>kite</reading> (かい) in the wind. Everyone follows the kite.
鴻:
  meaning: Wild Goose
  primary_reading: こう
  reading_type: onyomi
  meaning_mnemonic: >-
    A big <radical>bird</radical> lands in the <radical>inlet</radical> and honks loudly at all the fishing boats. It is a huge <kanji>wild goose</kanji>.
  reading_mnemonic: >-
    The <kanji>wild goose</kanji> is cold, so it steals your <reading>coa</reading>t (こう). The <radical>inlet</radical> part gives the sound, just like 江.
於:
  meaning: At
  primary_reading: お
  reading_type: onyomi
  meaning_mnemonic: >-
    You point in a <radical>direction</radical> and see a spot covered in <radical>ice</radical>. "Meet me right there, <kanji>at</kanji> that spot," you say.
  reading_mnemonic: >-
    Your friend slips on the ice <kanji>at</kanji> the meeting spot and shouts "<reading>Oh</reading>" (お)! You find it in formal writing like 於いて, meaning at or in.
赳:
  meaning: Brave
  primary_reading: きゅう
  reading_type: onyomi
  meaning_mnemonic: >-
    A warrior grabs a <radical>stick</radical> and starts to <radical>run</radical> straight at the enemy, not afraid at all. Only someone strong and <kanji>brave</kanji> would do that.
  reading_mnemonic: >-
    The <kanji>brave</kanji> warrior doesn't wait in the <reading>queue</reading> (きゅう) like everyone else. He just runs to the front.
禄:
  meaning: Stipend
  primary_reading: ろく
  reading_type: onyomi
  meaning_mnemonic: >-
    A samurai brings offerings to the <radical>altar</radical>, sweeping it with a <radical>hand broom</radical> and pouring <radical>water</radical> to clean it. In return his lord pays him a rice <kanji>stipend</kanji>.
  reading_mnemonic: >-
    The samurai keeps his <kanji>stipend</kanji> in a box with a big <reading>lock</reading> (ろく). Think of the 元禄 era, when stipends ran Edo life.
孟:
  meaning: Chief
  primary_reading: もう
  reading_type: onyomi
  meaning_mnemonic: >-
    The eldest <radical>child</radical> always gets served first from the <radical>plate</radical>. Being first, that child is the <kanji>chief</kanji> of all the siblings.
  reading_mnemonic: >-
    The <kanji>chief</kanji> child always says "<reading>Mo</reading>re (もう)!" and gets seconds. 孟子 is Mencius, chief among later Confucian thinkers.
嫡:
  meaning: Legitimate Heir
  primary_reading: ちゃく
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>woman</radical> stands proudly next to a little boy with a <radical>mohawk</radical>. She is the lawful wife, and the mohawk kid is her son, the <kanji>legitimate heir</kanji>.
  reading_mnemonic: >-
    The <kanji>legitimate heir</kanji> loves to <reading>chuck</reading> (ちゃく) things around the palace. 嫡子 is the rightful heir.
尭:
  meaning: Lofty
  primary_reading: ぎょう
  reading_type: onyomi
  meaning_mnemonic: >-
    Wild <radical>grass</radical> grows on top of a huge <radical>pi</radical> shaped platform, which stands on long <radical>legs</radical>. It towers so high above everything that it looks <kanji>lofty</kanji>.
  reading_mnemonic: >-
    From that <kanji>lofty</kanji> platform a <reading>gyo</reading>za (ぎょう) falls all the way to the ground. It is also the name of Yao, a lofty sage emperor of legend.
嚇:
  meaning: Threaten
  primary_reading: かく
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>mouth</radical> opens and <radical>suddenly</radical> lets out a huge roar right in your face. That is how a big animal tries to <kanji>threaten</kanji> you.
  reading_mnemonic: >-
    The animal tries to <kanji>threaten</kanji> you, but it just <reading>cough</reading>s (かく) halfway through the roar. 威嚇 means a threat or intimidation.
巳:
  meaning: Snake (Zodiac)
  primary_reading: み
  reading_type: kunyomi
  meaning_mnemonic: >-
    It looks just like <radical>oneself</radical>, but the top is sealed shut and the whole thing is coiled up tight. That coil is the zodiac <kanji>snake</kanji>.
  reading_mnemonic: >-
    The zodiac <kanji>snake</kanji> looks up and hisses "<reading>Me</reading> (み)! Look at me!" It is the sixth sign of the zodiac.
暢:
  meaning: Stretch
  primary_reading: ちょう
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>humble</radical> man steps out into the <radical>open</radical> sunshine after a long night of work. He raises his arms high above his head and has a long, relaxing <kanji>stretch</kanji>.
  reading_mnemonic: >-
    After his <kanji>stretch</kanji> he can <reading>chow</reading> (ちょう) down on breakfast and talk smoothly again. 流暢 means fluent, words stretching out with ease.
韻:
  meaning: Rhyme
  primary_reading: いん
  reading_type: onyomi
  meaning_mnemonic: >-
    Every <radical>member</radical> of the band makes the same <radical>sound</radical> at the end of each line. The lines all match up into a <kanji>rhyme</kanji>.
  reading_mnemonic: >-
    The <kanji>rhyme</kanji> is so catchy it gets stuck <reading>in</reading> (いん) your head. The <radical>member</radical> part gives the sound, just like 員.
硝:
  meaning: Saltpeter
  primary_reading: しょう
  reading_type: onyomi
  meaning_mnemonic: >-
    You find a white <radical>stone</radical> that bears a <radical>resemblance</radical> to salt, but if you lick it, it tastes awful. It is <kanji>saltpeter</kanji>, the stuff used in gunpowder.
  reading_mnemonic: >-
    Mix <kanji>saltpeter</kanji> into gunpowder and you get a big fireworks <reading>show</reading> (しょう). The <radical>resemblance</radical> part gives the sound, just like 肖.
勅:
  meaning: Imperial Order
  primary_reading: ちょく
  reading_type: onyomi
  meaning_mnemonic: >-
    The emperor ties a <radical>bundle</radical> of scrolls with ribbon and gives it the full <radical>power</radical> of the throne. Whatever is written inside is an <kanji>imperial order</kanji>.
  reading_mnemonic: >-
    The messenger rushing the <kanji>imperial order</kanji> to the palace nearly <reading>choke</reading>s (ちょく) from running so fast.
芹:
  meaning: Parsley
  primary_reading: せり
  reading_type: kunyomi
  meaning_mnemonic: >-
    You use an <radical>axe</radical> to chop up a pile of little green <radical>flowers</radical> and leaves. It's way too much force for such a tiny herb, but now you have chopped <kanji>parsley</kanji>.
  reading_mnemonic: >-
    You sprinkle the <kanji>parsley</kanji> on a bowl of <reading>cere</reading>al (せり). Strange breakfast, but very green.
棺:
  meaning: Coffin
  primary_reading: かん
  reading_type: onyomi
  meaning_mnemonic: >-
    The <radical>government</radical> orders a box made from a big <radical>tree</radical> for a very important official. It is long, dark, and has a lid. It is a <kanji>coffin</kanji>.
  reading_mnemonic: >-
    The <kanji>coffin</kanji> is so heavy that nobody <reading>can</reading> (かん) lift it. The <radical>government</radical> part gives the sound, just like 官.
儒:
  meaning: Confucian
  primary_reading: じゅ
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>person</radical> keeps making a <radical>demand</radical>: be polite, respect your elders, study hard. That person is a <kanji>Confucian</kanji> scholar.
  reading_mnemonic: >-
    The <kanji>Confucian</kanji> scholar sips <reading>ju</reading>ice (じゅ) while lecturing you. The <radical>demand</radical> part gives the sound, just like 需. 儒教 is Confucianism.
鳳:
  meaning: Phoenix
  primary_reading: ほう
  reading_type: onyomi
  meaning_mnemonic: >-
    A glowing <radical>bird</radical> lands on a <radical>table</radical> and spreads its flaming wings over the whole banquet. It is no ordinary bird. It is the <kanji>phoenix</kanji>.
  reading_mnemonic: >-
    The <kanji>phoenix</kanji> sets the tablecloth on fire, and everyone grabs a <reading>hose</reading> (ほう) to put it out.
馨:
  meaning: Fragrant
  primary_reading: けい
  reading_type: onyomi
  meaning_mnemonic: >-
    Your <radical>voice</radical> rings out, you wave a <radical>weapon</radical>, and a cloud of <radical>fragrance</radical> spreads everywhere. It's the sweetest smelling battle ever, perfectly <kanji>fragrant</kanji>.
  reading_mnemonic: >-
    The <kanji>fragrant</kanji> smell comes from a <reading>ca</reading>ke (けい) baking nearby. Nothing smells as good as fresh cake.
慧:
  meaning: Wise
  primary_reading: けい
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>comet</radical> streaks through the night sky and lands right in your <radical>heart</radical>. Suddenly you understand everything and feel very <kanji>wise</kanji>.
  reading_mnemonic: >-
    Now that you are <kanji>wise</kanji>, you know the secret <reading>Kay</reading> (けい) to life. You smile and keep it to yourself.
愁:
  meaning: Grief
  primary_reading: しゅう
  reading_type: onyomi
  meaning_mnemonic: >-
    In <radical>autumn</radical> the leaves fall, and your <radical>heart</radical> feels heavy as you watch them go. That quiet ache is <kanji>grief</kanji>.
  reading_mnemonic: >-
    Your <kanji>grief</kanji> makes you stare at your old <reading>shoe</reading> (しゅう) from summer. The <radical>autumn</radical> part gives the sound, just like 秋. 郷愁 is nostalgia.
