弘:
  meaning: Vast
  primary_reading: こう
  reading_type: onyomi
  meaning_mnemonic: >-
    Pull back a <radical>bow</radical> with all your <radical>private</radical> strength and the arrow flies so far over the plains that you finally see how <kanji>vast</kanji> the world is.
  reading_mnemonic: >-
    Standing on that <kanji>vast</kanji> plain, the wind hits you and you grab your <reading>coa</reading>t (こう) to keep warm.
彦:
  meaning: Lad
  primary_reading: ひこ
  reading_type: kunyomi
  meaning_mnemonic: >-
    A young man likes to <radical>stand</radical> at the edge of a <radical>cliff</radical>, letting the wind blow through his fabulous <radical>hair</radical>. Only a show-off <kanji>lad</kanji> would pose like that.
  reading_mnemonic: >-
    The <kanji>lad</kanji> poses so long that he gets the <reading>hic</reading>cups and starts going "<reading>hiko</reading>! <reading>hiko</reading>!" (ひこ) right at the cliff edge.
李:
  meaning: Plum
  primary_reading: すもも
  reading_type: kunyomi
  meaning_mnemonic: >-
    A <radical>child</radical> sits under a <radical>tree</radical> waiting for its fruit to drop. Plonk, a juicy purple <kanji>plum</kanji> lands right in the child's lap.
  reading_mnemonic: >-
    The child bites the <kanji>plum</kanji> and squeals "<reading>Sue, more mo</reading>re!" (すもも), demanding that Sue shake the tree again.
浩:
  meaning: Wide Expanse
  primary_reading: こう
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>tsunami</radical> rolls in and you <radical>announce</radical> it to the whole town. When it retreats, all that is left is a flat, shining <kanji>wide expanse</kanji> of water.
  reading_mnemonic: >-
    Out on that <kanji>wide expanse</kanji> of water you spot something floating. It is a <reading>coa</reading>t (こう), washed away by the wave.
宏:
  meaning: Wide
  primary_reading: こう
  reading_type: onyomi
  meaning_mnemonic: >-
    You build a <radical>roof</radical> over your <radical>private</radical> room, but you get carried away and the roof just keeps going. Your little room is now absurdly <kanji>wide</kanji>.
  reading_mnemonic: >-
    The room is so <kanji>wide</kanji> that you need a whole <reading>coa</reading>t (こう) rack along one wall just to fill it.
昌:
  meaning: Prosperous
  primary_reading: しょう
  reading_type: onyomi
  meaning_mnemonic: >-
    Two <radical>sun</radical>s stacked on top of each other means double the sunshine. Crops grow, people smile, and the whole land is <kanji>prosperous</kanji>.
  reading_mnemonic: >-
    The <kanji>prosperous</kanji> town throws a big <reading>show</reading> (しょう) to celebrate all that sunshine.
旭:
  meaning: Rising Sun
  primary_reading: あさひ
  reading_type: kunyomi
  meaning_mnemonic: >-
    You count to <radical>nine</radical> and the <radical>sun</radical> pops up over the horizon right on cue. That is the <kanji>rising sun</kanji>, exactly on schedule.
  reading_mnemonic: >-
    The <kanji>rising sun</kanji> is so bright that you yell "<reading>Ah, sa</reading>y <reading>hi</reading>!" (あさひ) and wave hello to it.
磯:
  meaning: Seashore
  primary_reading: いそ
  reading_type: kunyomi
  meaning_mnemonic: >-
    A <radical>stone</radical> beach where you can't count <radical>how many</radical> pebbles there are. Rocks and waves everywhere: you are on the <kanji>seashore</kanji>.
  reading_mnemonic: >-
    Walking along the <kanji>seashore</kanji> you find a crab and shout "<reading>I so</reading> want to keep it!" (いそ).
萩:
  meaning: Bush Clover
  primary_reading: はぎ
  reading_type: kunyomi
  meaning_mnemonic: >-
    <radical>Flowers</radical> that bloom in <radical>autumn</radical>, with little purple petals on drooping branches. That is the <kanji>bush clover</kanji>, the classic autumn flower of Japan.
  reading_mnemonic: >-
    The <kanji>bush clover</kanji> is so lovely that you <reading>hug</reading> it (はぎ) and get covered in petals.
栗:
  meaning: Chestnut
  primary_reading: くり
  reading_type: kunyomi
  meaning_mnemonic: >-
    A <radical>helicopter</radical> hovers over a <radical>tree</radical> and the downdraft shakes loose spiky brown nuts. They are <kanji>chestnut</kanji>s, and they rain down everywhere.
  reading_mnemonic: >-
    A <kanji>chestnut</kanji> lands on your head and you shout "<reading>Cree</reading>py tree!" (くり), rubbing the spot.
辰:
  meaning: Dragon (Zodiac)
  primary_reading: たつ
  reading_type: kunyomi
  meaning_mnemonic: >-
    Something long and scaly is curled up under a <radical>cliff</radical>. It is the <kanji>dragon</kanji> of the zodiac, sleeping in its cave.
  reading_mnemonic: >-
    The <kanji>dragon</kanji> wakes up and you notice it has a big <reading>tat</reading>too (たつ) of its own name on its belly.
霞:
  meaning: Haze
  primary_reading: かすみ
  reading_type: kunyomi
  meaning_mnemonic: >-
    Fine <radical>rain</radical> hangs in the air, and everything you see looks <radical>false</radical> and fuzzy. The mountains blur away into a soft spring <kanji>haze</kanji>.
  reading_mnemonic: >-
    Lost in the <kanji>haze</kanji>, you hear a voice calling "<reading>Cuss me</reading>!" (かすみ), but you can't see who it is.
淳:
  meaning: Pure
  primary_reading: じゅん
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>tsunami</radical> washes over everything, and you <radical>receive</radical> nothing but clean, sparkling water. It is completely <kanji>pure</kanji>.
  reading_mnemonic: >-
    That <kanji>pure</kanji> water is perfect for the first day of <reading>June</reading> (じゅん), when you dive right in.
桂:
  meaning: Katsura Tree
  primary_reading: かつら
  reading_type: kunyomi
  meaning_mnemonic: >-
    A <radical>tree</radical> whose heart-shaped leaves shine like a <radical>square jewel</radical> in the sun. That is the precious <kanji>katsura tree</kanji>.
  reading_mnemonic: >-
    Under the <kanji>katsura tree</kanji> a cat is playing with a big <reading>cats' rattle</reading> (かつら). The tree is basically its name.
晋:
  meaning: Advance
  primary_reading: しん
  reading_type: onyomi
  meaning_mnemonic: >-
    <radical>Two</radical> <radical>sun</radical>s rise one after another, and each day you march a little further. Day by day, you <kanji>advance</kanji>.
  reading_mnemonic: >-
    You <kanji>advance</kanji> so far that your <reading>shin</reading>s (しん) are bruised from all the walking.
晃:
  meaning: Clear
  primary_reading: こう
  reading_type: onyomi
  meaning_mnemonic: >-
    The <radical>sun</radical> sends out its <radical>light</radical> and every cloud vanishes. The sky is perfectly <kanji>clear</kanji>.
  reading_mnemonic: >-
    It is so <kanji>clear</kanji> and warm that you take off your <reading>coa</reading>t (こう). The <radical>light</radical> part gives the sound, like 光 (こう).
桐:
  meaning: Paulownia
  primary_reading: きり
  reading_type: kunyomi
  meaning_mnemonic: >-
    A <radical>tree</radical> where every leaf looks exactly the <radical>same</radical>: huge, round and soft. That is the <kanji>paulownia</kanji>, the tree on Japan's coins and crests.
  reading_mnemonic: >-
    A lumberjack wants to <reading>kill</reading> (きり) the <kanji>paulownia</kanji> to make a fancy wooden chest out of it.
鷹:
  meaning: Hawk
  primary_reading: たか
  reading_type: kunyomi
  meaning_mnemonic: >-
    Under a <radical>canopy</radical> sits a <radical>wild goose</radical>, nervous, because above it circles a much scarier <radical>bird</radical>. That hunter is a <kanji>hawk</kanji>.
  reading_mnemonic: >-
    The <kanji>hawk</kanji> swoops down and steals your <reading>taco</reading> (たか) right out of your hands.
猪:
  meaning: Boar
  primary_reading: いのしし
  reading_type: kunyomi
  meaning_mnemonic: >-
    It looks a bit like a <radical>dog</radical>, but <radical>someone</radical> says it has tusks and charges like a tank. It is a wild <kanji>boar</kanji>.
  reading_mnemonic: >-
    The <kanji>boar</kanji> charges at you, and you whisper "<reading>Ino</reading>... <reading>shh</reading>... <reading>shh</reading>..." (いのしし), hoping it calms down.
紘:
  meaning: Large
  primary_reading: こう
  reading_type: onyomi
  meaning_mnemonic: >-
    You keep a <radical>thread</radical> in your <radical>private</radical> drawer and it never seems to end. You pull and pull until it fills the room in a <kanji>large</kanji> pile.
  reading_mnemonic: >-
    With that <kanji>large</kanji> pile of thread you knit yourself an enormous <reading>coa</reading>t (こう).
敦:
  meaning: Sincere
  primary_reading: とん
  reading_type: onyomi
  meaning_mnemonic: >-
    You <radical>receive</radical> a gift and, instead of grumbling, you <radical>strike</radical> a little gong to say thanks. Your gratitude is warm and <kanji>sincere</kanji>.
  reading_mnemonic: >-
    Your <kanji>sincere</kanji> thanks weigh a <reading>ton</reading> (とん) in the giver's heart.
祐:
  meaning: Help
  primary_reading: ゆう
  reading_type: onyomi
  meaning_mnemonic: >-
    You kneel at the <radical>altar</radical> and raise your <radical>right</radical> hand to pray. The gods hear you and send down divine <kanji>help</kanji>.
  reading_mnemonic: >-
    The gods' <kanji>help</kanji> arrives with a note: "This is for <reading>you</reading>" (ゆう).
鵬:
  meaning: Giant Bird
  primary_reading: ほう
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>bird</radical> so huge it needs a <radical>companion</radical> just to help flap its wings. This is the legendary <kanji>giant bird</kanji> that flies across the sky for thousands of miles.
  reading_mnemonic: >-
    When the <kanji>giant bird</kanji> lands, its wings blow everything away and you scream "<reading>Ho</reading>ld on!" (ほう).
亘:
  meaning: Span
  primary_reading: こう
  reading_type: onyomi
  meaning_mnemonic: >-
    <radical>Two</radical> lines frame the <radical>dawn</radical>, one above and one below, stretching from one horizon to the other. Together they cover the whole <kanji>span</kanji> of the sky.
  reading_mnemonic: >-
    To cross that <kanji>span</kanji> in the cold dawn air, you'd better bring a <reading>coa</reading>t (こう).
笹:
  meaning: Bamboo Grass
  primary_reading: ささ
  reading_type: kunyomi
  meaning_mnemonic: >-
    <radical>Bamboo</radical> that spreads across the whole <radical>world</radical>, but small, low and leafy. That is <kanji>bamboo grass</kanji>, which pandas love to munch.
  reading_mnemonic: >-
    The <kanji>bamboo grass</kanji> rustles in the wind, going "<reading>sasa</reading>" (ささ) as you walk through it.
毅:
  meaning: Strong
  primary_reading: き
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>pig</radical> learns to <radical>stand</radical> on its hind legs and swing a <radical>weapon</radical>. Nobody messes with this pig, it is incredibly <kanji>strong</kanji> and determined.
  reading_mnemonic: >-
    The <kanji>strong</kanji> pig guards the <reading>key</reading> (き) to the farm, and nobody dares to take it.
稔:
  meaning: Harvest
  primary_reading: ねん
  reading_type: onyomi
  meaning_mnemonic: >-
    You stare at your <radical>grain</radical> field, lost in <radical>thought</radical> about how much rice it will give you. Then the ears turn gold and heavy: time for the <kanji>harvest</kanji>.
  reading_mnemonic: >-
    The <kanji>harvest</kanji> comes once a year, every <reading>nen</reading> (ねん). The <radical>thought</radical> part gives the sound, like 念 (ねん).
楊:
  meaning: Willow
  primary_reading: よう
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>tree</radical> whose branches hang <radical>open</radical> like a curtain, swaying down to the water. It is a <kanji>willow</kanji>.
  reading_mnemonic: >-
    A kid swings on the <kanji>willow</kanji> branches and shouts "<reading>Yo</reading>!" (よう) at everyone passing by.
椿:
  meaning: Camellia
  primary_reading: つばき
  reading_type: kunyomi
  meaning_mnemonic: >-
    A <radical>tree</radical> that bursts into bright red flowers at the very start of <radical>spring</radical>, even while snow is still around. That is the <kanji>camellia</kanji>.
  reading_mnemonic: >-
    The <kanji>camellia</kanji> flowers are so pretty that you put <reading>two buckey</reading>s (つばき) under the tree to collect the falling blossoms.
厘:
  meaning: Rin
  primary_reading: りん
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>village</radical> hidden under a <radical>cliff</radical> is so tiny and poor that everything costs only a fraction of a coin. They pay in <kanji>rin</kanji>, a thousandth of a yen.
  reading_mnemonic: >-
    The meaning is already the reading: one <kanji>rin</kanji> is read <reading>rin</reading> (りん), like the <reading>rin</reading>g of a tiny coin.
圭:
  meaning: Square Jewel
  primary_reading: けい
  reading_type: onyomi
  meaning_mnemonic: >-
    <radical>Dirt</radical> stacked on top of <radical>dirt</radical>, pressed so hard it turns into a precious stone with sharp corners. It is a <kanji>square jewel</kanji>.
  reading_mnemonic: >-
    You lock that <kanji>square jewel</kanji> away and keep the <reading>key</reading> (けい) on a string around your neck.
薫:
  meaning: Fragrant
  primary_reading: くん
  reading_type: onyomi
  meaning_mnemonic: >-
    You put a <radical>heavy</radical> pile of <radical>flowers</radical> in a pot and <radical>boil</radical> them. The whole house fills with a sweet, <kanji>fragrant</kanji> smell.
  reading_mnemonic: >-
    The <kanji>fragrant</kanji> steam is so strong that your friend <reading>Kun</reading> (くん) wanders in from next door, following his nose.
伍:
  meaning: Five-Man Squad
  primary_reading: ご
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>person</radical> plus four more makes <radical>five</radical>. Line them up and you have a <kanji>five-man squad</kanji>.
  reading_mnemonic: >-
    The <kanji>five-man squad</kanji> leader yells "<reading>Go</reading>!" (ご) and they all march out. The <radical>five</radical> part gives the sound, like 五 (ご).
蘭:
  meaning: Orchid
  primary_reading: らん
  reading_type: onyomi
  meaning_mnemonic: >-
    These <radical>flowers</radical> <radical>rise high</radical> on elegant stems, looking expensive and fancy. They are <kanji>orchid</kanji>s.
  reading_mnemonic: >-
    You knock over a pricey <kanji>orchid</kanji> pot and <reading>ran</reading> (らん) away before the shop owner noticed.
秦:
  meaning: Qin Dynasty
  primary_reading: しん
  reading_type: onyomi
  meaning_mnemonic: >-
    <radical>Three</radical> <radical>big</radical> fields of <radical>grain</radical> fed a huge army and built an empire. That empire was the <kanji>Qin dynasty</kanji>, which first united China.
  reading_mnemonic: >-
    The soldiers of the <kanji>Qin dynasty</kanji> marched so much that their <reading>shin</reading>s (しん) were always sore.
茅:
  meaning: Miscanthus Reed
  primary_reading: かや
  reading_type: kunyomi
  meaning_mnemonic: >-
    Tall <radical>flowers</radical> of the field with leaves as sharp as a <radical>spear</radical>. That is <kanji>miscanthus reed</kanji>, used to thatch old farmhouse roofs.
  reading_mnemonic: >-
    You collect <kanji>miscanthus reed</kanji> and pile it into your <reading>kaya</reading>k (かや) to bring it home.
郁:
  meaning: Fragrance
  primary_reading: いく
  reading_type: onyomi
  meaning_mnemonic: >-
    Every house in the <radical>village</radical> seems to <radical>have</radical> a garden full of blossoms. The whole place is drowning in sweet <kanji>fragrance</kanji>.
  reading_mnemonic: >-
    The <kanji>fragrance</kanji> is so strong that a visitor goes "<reading>Ick</reading>, too much!" (いく).
楠:
  meaning: Camphor Tree
  primary_reading: くすのき
  reading_type: kunyomi
  meaning_mnemonic: >-
    A huge <radical>tree</radical> that grows in the warm <radical>south</radical>, with leaves that smell like medicine. It is the <kanji>camphor tree</kanji>, often found at old shrines.
  reading_mnemonic: >-
    The smell of the <kanji>camphor tree</kanji> is so sharp that you <reading>cuss</reading> and say "<reading>no key</reading>, I'm not climbing that" (くすのき).
玲:
  meaning: Tinkling Jewels
  primary_reading: れい
  reading_type: onyomi
  meaning_mnemonic: >-
    The <radical>king</radical> gives <radical>orders</radical>, and with every gesture the jewels on his robe clink together. That sound is the <kanji>tinkling jewels</kanji>.
  reading_mnemonic: >-
    The <kanji>tinkling jewels</kanji> catch every <reading>ray</reading> (れい) of light. The <radical>orders</radical> part gives the sound, like 令 (れい).
肇:
  meaning: Beginning
  primary_reading: ちょう
  reading_type: onyomi
  meaning_mnemonic: >-
    You open a <radical>door</radical>, <radical>strike</radical> it with a flourish, and pick up a <radical>brush</radical> to write the first line. This is the <kanji>beginning</kanji> of something great.
  reading_mnemonic: >-
    At the <kanji>beginning</kanji> of every great story, someone yells "<reading>Cho</reading>ose your hero!" (ちょう).
亨:
  meaning: Go Smoothly
  primary_reading: こう
  reading_type: onyomi
  meaning_mnemonic: >-
    Put a <radical>lid</radical> on your <radical>mouth</radical>, stop complaining, and just <radical>finish</radical> the job. Suddenly everything starts to <kanji>go smoothly</kanji>.
  reading_mnemonic: >-
    Things <kanji>go smoothly</kanji> until you snag your <reading>coa</reading>t (こう) on the door. The <radical>mouth</radical> part gives the sound, like 口 (こう).
逓:
  meaning: Relay
  primary_reading: てい
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>tiger</radical> rides a <radical>scooter</radical> down the road, carrying the mail to the next station, where another tiger takes over. It is a postal <kanji>relay</kanji>.
  reading_mnemonic: >-
    At every stop of the <kanji>relay</kanji>, the tigers break for <reading>tea</reading> (てい) before passing the bag on.
嶺:
  meaning: Peak
  primary_reading: れい
  reading_type: onyomi
  meaning_mnemonic: >-
    A <radical>mountain</radical> that marks the edge of your <radical>territory</radical>. You climb all the way up to its highest <kanji>peak</kanji> to see the border.
  reading_mnemonic: >-
    On the <kanji>peak</kanji>, the very first <reading>ray</reading> (れい) of sunrise hits you before anyone else.
喬:
  meaning: Tall
  primary_reading: きょう
  reading_type: onyomi
  meaning_mnemonic: >-
    Someone takes a huge <radical>drink</radical> and then twirls their <radical>mustache</radical> while stretching up on tiptoes. Look how <kanji>tall</kanji> and proud they are.
  reading_mnemonic: >-
    The <kanji>tall</kanji> show-off bumps his head on the ceiling of a <reading>Kyo</reading>to (きょう) teahouse.
