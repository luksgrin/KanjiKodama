name: CI

# Manual only (issue #3, constraints: no Actions minutes). Everything builds and tests locally:
# `cd app && npm run check`. Releases: release.yml (manual).
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content-pipeline:
    name: Content pipeline tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/content
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q
