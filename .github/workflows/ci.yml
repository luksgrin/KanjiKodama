name: CI

# Manual only (issue #3, constraints: no Actions minutes). Everything builds and tests locally:
# `cd web && npm run check`; the Android release is web/scripts/release-android.sh.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, lint and test
        run: ./gradlew build --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kanjikodama-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  content-pipeline:
    name: Content pipeline tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/content
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q
