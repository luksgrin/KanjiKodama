name: Release APK (manual)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name to stamp on the APK (e.g. 0.1.0)"
        required: true
        default: "0.1.0"
      create_github_release:
        description: "Also create a GitHub release with the APK attached (private repo)"
        type: boolean
        default: true

jobs:
  release:
    name: Signed KanjiKodama APK (offline fork with bundled content)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: durtles
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # The WaniKani content lives in a private release of luksgrin/KanjiKodamaData.
      # KANJIKODAMA_DATA_TOKEN: fine-grained token with read access to that repository's contents.
      # (MOJIMORI_DATA_TOKEN is the same secret under the app's former name, used until it is re-added.)
      - name: Fetch bundled content
        env:
          GH_TOKEN: ${{ secrets.KANJIKODAMA_DATA_TOKEN || secrets.MOJIMORI_DATA_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret KANJIKODAMA_DATA_TOKEN is missing; a release without content would be useless."
            exit 1
          fi
          python3 tools/build_wk_asset.py
          test -s app/src/main/assets/wk-content.db

      # Every release must carry the same signature, or Android refuses to update the installed app.
      - name: Restore signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are missing; a release signed with a throwaway key could not be updated later."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$RELEASE_STORE_PASSWORD"
            echo "keyAlias=$RELEASE_KEY_ALIAS"
            echo "keyPassword=$RELEASE_KEY_PASSWORD"
          } > keystore.properties

      - name: Assemble release
        run: ./gradlew :app:assembleRelease --no-daemon -PversionName=${{ inputs.version_name }} -PversionCode=$((100 + ${{ github.run_number }}))

      - name: Name the APK
        run: |
          mv app/build/outputs/apk/release/*.apk app/build/outputs/apk/release/kanjikodama-${{ inputs.version_name }}.apk
          ls -la app/build/outputs/apk/release/

      - uses: actions/upload-artifact@v4
        with:
          name: kanjikodama-${{ inputs.version_name }}
          path: durtles/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub release
        if: ${{ inputs.create_github_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version_name }}
          name: KanjiKodama ${{ inputs.version_name }}
          files: durtles/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
