apply plugin: 'com.android.application'

// Release signing: app/android/keystore.properties (git-ignored; keystore.properties.example) names
// the keystore, normally release.jks (git-ignored) next to it, relative to that file. Without it,
// release builds are unsigned.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

// Side-by-side variant (-PsideBySide): every build type installs as app.kanjikodama.wk.web, next
// to the main app. Without it: release app.kanjikodama.wk, debug app.kanjikodama.wk.debug.
def sideBySide = project.hasProperty('sideBySide')

// versionName from app/package.json; versionCode from scripts/release/version.ts (passed by
// scripts/release-android.sh).
def webVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json')).version

android {
    namespace = "app.kanjikodama.wk"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        // The app's id; the build types add the suffixes below.
        applicationId "app.kanjikodama.wk"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Overridable: -PversionCode=7001 -PversionName=0.6.1.
        versionCode project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : 1000
        versionName project.hasProperty('versionName') ? project.property('versionName') : webVersion

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
            // The content file is read at every start: stored uncompressed it streams without
            // inflating 33 MB first (faster start-up).
            noCompress 'db'
        }
    }
    signingConfigs {
        if (!keystoreProps.isEmpty()) {
            release {
                def store = new File(keystoreProps.getProperty('storeFile'))
                storeFile store.isAbsolute() ? store : new File(keystorePropsFile.parentFile, keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        debug {
            // ".debug", or ".web" side by side; signed with the default debug key.
            applicationIdSuffix sideBySide ? ".web" : ".debug"
        }
        release {
            if (sideBySide) applicationIdSuffix ".web"
            if (!keystoreProps.isEmpty()) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Background sync (BackgroundSyncWorker) and its headless WebView's asset loader.
    implementation "androidx.work:work-runtime:2.11.0"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
