apply plugin: 'com.android.application'

// Release signing with the Java app's key (issue #3, step 6): web/android/keystore.properties
// (git-ignored; keystore.properties.example) names the keystore, normally release.jks (the Java
// app's key, git-ignored) next to it, relative to that file. Without it, release builds are unsigned.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

// Side-by-side variant (-PsideBySide): every build type installs as app.kanjikodama.wk.web, next
// to the Java app, as before the cutover. Without it: release app.kanjikodama.wk (replaces the Java
// app), debug app.kanjikodama.wk.debug (replaces the Java debug app: the legacy migration test).
def sideBySide = project.hasProperty('sideBySide')

// versionName from web/package.json; versionCode 1000+ (the Java releases used 100 + run number).
def webVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json')).version

android {
    namespace = "app.kanjikodama.wk"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        // Identity (issue #3, step 6): the Java app's id; the build types add the suffixes below.
        applicationId "app.kanjikodama.wk"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Overridable like the Java app's: -PversionCode=1001 -PversionName=0.2.0.
        versionCode project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : 1000
        versionName project.hasProperty('versionName') ? project.property('versionName') : webVersion

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
            // The content file is read at every start: stored uncompressed it streams without
            // inflating 33 MB first (start-up, docs/android-parity.md).
            noCompress 'db'
        }
    }
    signingConfigs {
        if (!keystoreProps.isEmpty()) {
            release {
                def store = new File(keystoreProps.getProperty('storeFile'))
                storeFile store.isAbsolute() ? store : new File(keystorePropsFile.parentFile, keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        debug {
            // Same id and (default) debug key as the Java debug app; ".web" side by side.
            applicationIdSuffix sideBySide ? ".web" : ".debug"
        }
        release {
            if (sideBySide) applicationIdSuffix ".web"
            if (!keystoreProps.isEmpty()) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Background sync (BackgroundSyncWorker) and its headless WebView's asset loader.
    implementation "androidx.work:work-runtime:2.11.0"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    // LegacyMigrationPlugin reads the Java app's API token (same library and version as the Java app used).
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
